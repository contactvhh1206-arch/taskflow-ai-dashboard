<body class="bg-background text-on-surface antialiased overflow-hidden h-screen w-screen flex">
  <div id="root" class="h-full w-full"></div>
  <script>
    // --- COMMON DATA SERVICE ---
    window.DataService = {
      DB_KEY: 'Company_Master_Logs',

      saveData: function ({ org_unit, entry_type, content, attachments = [], aiVectorData = '' }) {
        const history = JSON.parse(localStorage.getItem(this.DB_KEY) || '[]');
        const now = new Date();

        const newRecord = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
          timestamp: now.toISOString(),
          displayTime: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
          date: now.toLocaleDateString('vi-VN'),
          org_unit,
          entry_type,
          content,
          attachments,
          aiVectorData
        };

        const updatedHistory = [newRecord, ...history];
        localStorage.setItem(this.DB_KEY, JSON.stringify(updatedHistory));
        return newRecord;
      },

      fetchHistory: function (filters = {}) {
        const history = JSON.parse(localStorage.getItem(this.DB_KEY) || '[]');
        let filtered = history;
        if (filters.org_unit) filtered = filtered.filter(item => item.org_unit === filters.org_unit);
        if (filters.entry_type) filtered = filtered.filter(item => item.entry_type === filters.entry_type);
        if (filters.date) filtered = filtered.filter(item => item.date === filters.date);
        return filtered;
      }
    };
  </script>
  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    const AuthContext = createContext();

    const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2);

    const INITIAL_TASKS = [];

    const AI_INSIGHTS = [
      { id: 1, title: 'Cảnh báo Tiến độ', desc: 'Task "Nghiệm thu KPI tháng 4" sắp trễ hạn. Đề xuất gửi AI Ping đôn đốc.', type: 'warning' },
      { id: 2, title: 'Tối ưu Nguồn lực', desc: 'Cơ sở 1 đang quá tải 20% so với định mức. Có thể điều phối nhân sự từ Cơ sở 2 sang hỗ trợ.', type: 'info' },
    ];

    // --- COMPONENT DAILY CHECKIN ---
    function DailyCheckin({ onCheckinSuccess, showToast }) {
      const { user } = useContext(AuthContext);
      const today = new Date().toLocaleDateString('vi-VN');

      const [loading, setLoading] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [submittedTime, setSubmittedTime] = useState(null);
      const [selectedShift, setSelectedShift] = useState('Ca 1');
      const [checkins, setCheckins] = useState([]);

      const [activeTab, setActiveTab] = useState('checkin');

      const [logs, setLogs] = useState([]);
      const [logContent, setLogContent] = useState('');
      const [logImage, setLogImage] = useState(null);

      const [formData, setFormData] = useState({
        shift: 'Ca 1',
        hr_letan: { status: null, type: null, note: '' },
        hr_baove: { status: null, type: null, note: '' },
        hr_clocker: { status: null, type: null, note: '' },
        hr_ktv: { status: null, type: null, note: '' },
        manual_auth: 0,
        manual_unauth: 0,
        eq_camera: null,
        eq_maytinh: null,
        eq_den: null,
        eq_maylanh: null,
        eq_other: '',
        cleaning_done: false
      });

      const [logFilterDate, setLogFilterDate] = useState(new Date().toISOString().split('T')[0]);
      const [logFilterSearch, setLogFilterSearch] = useState('');
      const [logFilterHasImage, setLogFilterHasImage] = useState(false);

      const [historyFilterDate, setHistoryFilterDate] = useState(new Date().toISOString().split('T')[0]);
      const [historyFilterSearch, setHistoryFilterSearch] = useState('');
      const [historyFilterHasImage, setHistoryFilterHasImage] = useState(false);

      useEffect(() => {
        const fetchAll = () => {
          const attendanceData = window.DataService.fetchHistory({ entry_type: 'Attendance' });
          setCheckins(attendanceData.map(item => ({
            id: item.id,
            facility_id: item.org_unit,
            date: item.date,
            shift: item.content.shift,
            timestamp: item.displayTime,
            formData: item.content,
            aiVectorData: item.aiVectorData
          })));

          const logsData = window.DataService.fetchHistory({ entry_type: 'Operation_Log' });
          setLogs(logsData.map(item => ({
            id: item.id,
            facility_id: item.org_unit,
            date: item.date,
            timestamp: item.displayTime,
            content: item.content,
            image: item.attachments[0] || null,
            aiVectorData: item.aiVectorData
          })));
        };
        fetchAll();
      }, []);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            const img = new Image();
            img.onload = () => {
               const canvas = document.createElement('canvas');
               const MAX_WIDTH = 1200;
               const MAX_HEIGHT = 1200;
               let width = img.width;
               let height = img.height;

               if (width > height) {
                 if (width > MAX_WIDTH) {
                   height *= MAX_WIDTH / width;
                   width = MAX_WIDTH;
                 }
               } else {
                 if (height > MAX_HEIGHT) {
                   width *= MAX_HEIGHT / height;
                   height = MAX_HEIGHT;
                 }
               }
               canvas.width = width;
               canvas.height = height;
               const ctx = canvas.getContext('2d');
               ctx.drawImage(img, 0, 0, width, height);
               
               // Thêm Metadata Thời gian thực (Timestamp) làm bằng chứng
               const now = new Date();
               const timestamp = now.toLocaleString('vi-VN');
               ctx.font = 'bold 16px sans-serif';
               const textWidth = ctx.measureText(`Captured: ${timestamp}`).width;
               ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
               ctx.fillRect(10, height - 40, textWidth + 20, 30);
               ctx.fillStyle = '#ffffff';
               ctx.fillText(`Captured: ${timestamp}`, 20, height - 20);

               // Nén ảnh (compress) dạng JPEG với quality 0.7
               const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
               setLogImage(compressedDataUrl);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddLog = () => {
        if (!logContent.trim() && !logImage) return;

        const now = new Date();
        const timestamp = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

        const aiVectorData = `[${timestamp}] CƠ SỞ ${user.facility_id} | NHẬT KÝ: ${logContent.trim() || 'Không có nội dung'} ${logImage ? '| CÓ ẢNH ĐÍNH KÈM' : ''}`;

        const newRecord = window.DataService.saveData({
          org_unit: user.facility_id,
          entry_type: 'Operation_Log',
          content: logContent.trim(),
          attachments: logImage ? [logImage] : [],
          aiVectorData
        });

        const mappedLog = {
          id: newRecord.id,
          facility_id: newRecord.org_unit,
          date: newRecord.date,
          timestamp: newRecord.displayTime,
          content: newRecord.content,
          image: newRecord.attachments[0] || null,
          aiVectorData: newRecord.aiVectorData
        };

        setLogs([mappedLog, ...logs]);
        setLogContent('');
        setLogImage(null);
      };

      useEffect(() => {
        const submitted = checkins.find(c => c.facility_id === user.facility_id && c.date === today && c.shift === selectedShift);
        if (submitted) {
          setFormData(submitted.formData);
          setIsSubmitted(true);
          setSubmittedTime(submitted.timestamp);
        } else {
          setFormData({
            shift: selectedShift,
            hr_letan: { status: null, type: null, note: '' },
            hr_baove: { status: null, type: null, note: '' },
            hr_clocker: { status: null, type: null, note: '' },
            hr_ktv: { status: null, type: null, note: '' },
            manual_auth: 0,
            manual_unauth: 0,
            eq_camera: null,
            eq_maytinh: null,
            eq_den: null,
            eq_maylanh: null,
            eq_other: '',
            cleaning_done: false
          });
          setIsSubmitted(false);
          setSubmittedTime(null);
        }
      }, [selectedShift, checkins, user.facility_id, today]);

      const checkHR = (hr) => {
        if (!hr || !hr.status) return false;
        if (hr.status === 'thieu') {
          const noteStr = hr.note || '';
          if (!noteStr.trim()) return false;
        }
        return true;
      };

      const sumManual = (formData.manual_auth || 0) + (formData.manual_unauth || 0);

      const checkEq = (field) => {
        if (!formData[field]) return false;
        if (formData[field] === 'su_co') {
          if (!formData[field + '_note'] || !formData[field + '_note'].trim()) return false;
        }
        return true;
      };

      const isFormValid =
        checkHR(formData.hr_letan) && checkHR(formData.hr_baove) && checkHR(formData.hr_clocker) && checkHR(formData.hr_ktv) &&
        checkEq('eq_camera') && checkEq('eq_maytinh') && checkEq('eq_den') && checkEq('eq_maylanh') &&
        formData.cleaning_done;



      console.log('--- FORM STATE ---', formData, '| IS_VALID:', isFormValid);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!isFormValid || isSubmitted) return;

        setLoading(true);
        setTimeout(() => {
          const now = new Date();
          const timestamp = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

          const getNotes = () => {
            return ['hr_letan', 'hr_baove', 'hr_clocker', 'hr_ktv']
              .filter(k => formData[k].status === 'thieu')
              .map(k => `${k.replace('hr_', '').toUpperCase()}: ${formData[k].note}`)
              .join(' | ');
          };
          const getEqNotes = () => {
            return [
              { k: 'eq_camera', n: 'Camera' },
              { k: 'eq_maytinh', n: 'Máy tính' },
              { k: 'eq_den', n: 'Đèn' },
              { k: 'eq_maylanh', n: 'Máy lạnh' }
            ].filter(e => formData[e.k] === 'su_co')
              .map(e => `${e.n.toUpperCase()}: ${formData[e.k + '_note']}`)
              .join(' | ');
          };
          const currentSumManual = (formData.manual_auth || 0) + (formData.manual_unauth || 0);
          const eqNotesStr = getEqNotes();
          const aiVectorData = `[${timestamp}] CƠ SỞ ${user.facility_id} | CA ${selectedShift} | NGHỈ: ${currentSumManual} (CP: ${formData.manual_auth || 0}, KP: ${formData.manual_unauth || 0}) | HỖ TRỢ: ${getNotes() || 'Không có'} | SỰ CỐ: ${eqNotesStr || 'Không có'}`;

          const newRecord = window.DataService.saveData({
            org_unit: user.facility_id,
            entry_type: 'Attendance',
            content: { ...formData, shift: selectedShift },
            attachments: [],
            aiVectorData
          });

          const newCheckin = {
            id: newRecord.id,
            facility_id: newRecord.org_unit,
            date: newRecord.date,
            shift: selectedShift,
            timestamp: newRecord.displayTime,
            formData,
            aiVectorData
          };

          const filtered = checkins.filter(c => !(c.facility_id === user.facility_id && c.date === today && c.shift === selectedShift));
          const newHistory = [...filtered, newCheckin];
          setCheckins(newHistory);

          setIsSubmitted(true);
          setSubmittedTime(timestamp);
          if (showToast) showToast('Lưu điểm danh thành công');
          if (onCheckinSuccess) onCheckinSuccess(newCheckin);

          setLoading(false);
        }, 800);
      };

      const setVal = (field, val) => {
        setIsSubmitted(false);
        setFormData(prev => ({ ...prev, [field]: val }));
      };

      const updateHR = (field, key, value) => {
        setIsSubmitted(false);
        setFormData(prev => ({
          ...prev,
          [field]: { ...prev[field], [key]: value }
        }));
      };

      const renderHRSegment = (label, field) => {
        const hr = formData[field];
        const noteStr = hr.note || '';
        const isError = hr.status === 'thieu' && !noteStr.trim();
        return (
          <div className={`p-4 bg-surface-container-low dark:bg-[#252525] rounded-xl border ${isError ? 'border-error/50 shadow-sm shadow-error/10' : 'border-outline-variant dark:border-gray-700 shadow-sm'} flex flex-col gap-3 transition-colors`}>
            <div className="flex items-center justify-between">
              <span className="text-sm font-medium text-gray-700 dark:text-gray-300">{label}</span>
              <div className="flex bg-surface-container-highest dark:bg-[#1a1a1a] rounded-lg p-1 gap-1">
                <button type="button" onClick={() => updateHR(field, 'status', 'du')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${hr.status === 'du' ? 'bg-success text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                  Đã sẵn sàng
                </button>
                <button type="button" onClick={() => updateHR(field, 'status', 'thieu')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${hr.status === 'thieu' ? 'bg-error text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                  Cần hỗ trợ
                </button>
              </div>
            </div>

            {hr.status === 'thieu' && (
              <textarea
                placeholder="Nhập phương án điều phối (VD: Thiếu 1 Lễ tân, cần CS2 hỗ trợ)..."
                value={noteStr}
                onChange={(e) => updateHR(field, 'note', e.target.value)}
                className={`w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border ${!noteStr.trim() ? 'border-error' : 'border-gray-300 dark:border-gray-600'} rounded-lg text-xs outline-none focus:ring-1 focus:ring-primary dark:text-white transition-colors placeholder-gray-400 min-h-[60px] resize-y`}
              />
            )}
          </div>
        );
      };

      const renderSegment = (label, field, val1, label1, val2, label2) => {
        const isError = formData[field] === 'su_co' && (!formData[field + '_note'] || !formData[field + '_note'].trim());
        return (
          <div className={`p-4 bg-surface-container-low dark:bg-[#252525] rounded-xl border ${isError ? 'border-error/50 shadow-sm shadow-error/10' : 'border-outline-variant dark:border-gray-700 shadow-sm'} flex flex-col gap-3 transition-colors`}>
            <div className="flex items-center justify-between">
              <span className="text-sm font-medium text-gray-700 dark:text-gray-300">{label}</span>
              <div className="flex bg-surface-container-highest dark:bg-[#1a1a1a] rounded-lg p-1 gap-1">
                <button type="button" onClick={() => setVal(field, val1)} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${formData[field] === val1 ? 'bg-success text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                  {label1}
                </button>
                <button type="button" onClick={() => setVal(field, val2)} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-all ${formData[field] === val2 ? 'bg-error text-white shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}>
                  {label2}
                </button>
              </div>
            </div>
            {formData[field] === 'su_co' && (
              <textarea
                placeholder="Nhập mô tả sự cố (VD: Camera bị mờ)..."
                value={formData[field + '_note'] || ''}
                onChange={(e) => setVal(field + '_note', e.target.value)}
                className={`w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border ${!formData[field + '_note']?.trim() ? 'border-error' : 'border-gray-300 dark:border-gray-600'} rounded-lg text-xs outline-none focus:ring-1 focus:ring-primary dark:text-white transition-colors placeholder-gray-400 min-h-[50px] resize-y`}
              />
            )}
          </div>
        );
      };

      const ca1Status = checkins.find(c => c.facility_id === user.facility_id && c.date === today && c.shift === 'Ca 1');
      const caLoStatus = checkins.find(c => c.facility_id === user.facility_id && c.date === today && c.shift === 'Ca Lỡ');
      const ca2Status = checkins.find(c => c.facility_id === user.facility_id && c.date === today && c.shift === 'Ca 2');

      const countAuthAbsence = formData.manual_auth || 0;
      const countUnauthAbsence = formData.manual_unauth || 0;

      return (
        <div className="w-full max-w-4xl mx-auto flex flex-col gap-6 mt-6">
          {/* Tabs */}
          <div className="flex gap-2 p-1 bg-surface-container-low dark:bg-[#1e1e1e] rounded-xl border border-outline-variant dark:border-gray-800 w-fit mx-auto shadow-sm">
            <button
              onClick={() => setActiveTab('checkin')}
              className={`flex items-center gap-2 px-6 py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'checkin' ? 'bg-white dark:bg-[#2a2a2a] text-primary shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}
            >
              <span className="material-symbols-outlined text-[20px]">fact_check</span>
              Điểm Danh Hàng Ngày
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`flex items-center gap-2 px-6 py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'history' ? 'bg-white dark:bg-[#2a2a2a] text-primary shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}
            >
              <span className="material-symbols-outlined text-[20px]">history</span>
              Lịch Sử Báo Cáo các Ca làm việc
            </button>
            <button
              onClick={() => setActiveTab('log_history')}
              className={`flex items-center gap-2 px-6 py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'log_history' ? 'bg-white dark:bg-[#2a2a2a] text-secondary shadow-sm' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}`}
            >
              <span className="material-symbols-outlined text-[20px]">history_edu</span>
              Lịch Sử Nhật Ký
            </button>
          </div>

          {activeTab === 'checkin' && (
            <div className="flex flex-col gap-6 animate-fade-in">
              {/* Thẻ trạng thái báo cáo */}
              <div className="bg-white dark:bg-[#1e1e1e] p-5 rounded-2xl border border-outline-variant dark:border-gray-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 animate-fade-in">
                <div>
                  <h3 className="text-sm font-bold text-gray-800 dark:text-gray-200 flex items-center gap-2">
                    <span className="material-symbols-outlined text-primary">analytics</span> Trạng thái Báo cáo Hôm nay
                  </h3>
                  <p className="text-xs text-gray-500 mt-1">Cơ sở: <span className="font-medium text-gray-700 dark:text-gray-300">{user?.facility_id}</span> | Ngày: {today}</p>
                </div>
                <div className="flex gap-4 md:gap-6 flex-wrap">
                  <div className="flex flex-col gap-1 text-sm md:border-l border-gray-200 dark:border-gray-700 md:pl-5">
                    <span className="font-semibold dark:text-gray-200">Ca 1 (Sáng)</span>
                    {ca1Status ? (
                      <span className="inline-flex items-center gap-1.5 font-medium text-xs text-success dark:text-green-400"><span className="w-2 h-2 rounded-full bg-success"></span> Đã báo cáo lúc {ca1Status.timestamp}</span>
                    ) : (
                      <span className="inline-flex items-center gap-1.5 font-medium text-xs text-error dark:text-red-400"><span className="w-2 h-2 rounded-full bg-error animate-pulse"></span> Chưa báo cáo</span>
                    )}
                  </div>
                  <div className="flex flex-col gap-1 text-sm md:border-l border-gray-200 dark:border-gray-700 md:pl-5">

    function Login() {
      const { login } = useContext(AuthContext);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const doLogin = async (usr, pwd) => {
        setError('');
        setLoading(true);

        try {
          const response = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usr, password: pwd })
          });

          let data;
          if (response.ok) {
            data = await response.json();
          } else {
            const users = JSON.parse(localStorage.getItem('taskflow_users') || '[]');
            const foundUser = users.find(u => u.username === usr && (u.password === pwd || u.password === btoa(pwd)));
            if (foundUser) {
              if (!foundUser.isActive) {
                throw new Error('Tài khoản này đã bị khóa!');
              }
              data = { success: true, token: 'mock-token', user: foundUser };
            } else {
              throw new Error('Tài khoản hoặc mật khẩu không chính xác.');
            }
          }

          if (data.success) {
            switch (data.user.role) {
              case 'FINANCE_DEPT':
                localStorage.setItem('taskflow_default_tab', 'dashboard');
                break;
              default:
                localStorage.removeItem('taskflow_default_tab');
            }
            login(data.user, data.token);
          } else {
            setError(data.error);
          }
        } catch (err) {
          const users = JSON.parse(localStorage.getItem('taskflow_users') || '[]');
          const foundUser = users.find(u => u.username === usr && (u.password === pwd || u.password === btoa(pwd)));
          if (foundUser) {
            if (foundUser.is_deleted) {
              setError('Tài khoản không tồn tại.');
            } else if (!foundUser.isActive) {
              setError('Tài khoản này đã bị khóa!');
            } else {
              switch (foundUser.role) {
                case 'FINANCE_DEPT':
                  localStorage.setItem('taskflow_default_tab', 'dashboard');
                  break;
                default:
                  localStorage.removeItem('taskflow_default_tab');
              }
              login(foundUser, 'mock-token');
            }
          } else {
            setError(err.message || 'Tài khoản hoặc mật khẩu không chính xác.');
          }
        } finally {
          setLoading(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        doLogin(username, password);
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-surface-container dark:bg-[#121212] relative overflow-hidden transition-colors w-full h-full">

          const aiConfig = JSON.parse(localStorage.getItem('taskflow_ai_config') || '{}');
          const currentAiModel = aiConfig.aiModel;
          const API_KEY = aiConfig.apiKey || '';
          const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
          
          let parsedTasks = [];

          if (!currentAiModel) {
            if (window.showToast) window.showToast('Lỗi hệ thống: Chưa cấu hình Model AI trong Admin', 'error');
            return [];
          }

          if (!API_KEY) {
             // MOCK FRONTEND REGEX PARSER (Fallback khi không có API Key)
             const lines = text.split('\n').filter(l => l.trim().length > 0);
             parsedTasks = lines.map((line, idx) => {
                const parts = line.split('-').map(p => p.trim());
                return {
                   task_title: parts[0] || `Công việc ${idx + 1}`,
                   description: parts.slice(1).join(' - ') || line,
                   pic: user?.name || 'Unknown',
                   deadline: new Date().toISOString().split('T')[0],
                   priority_level: /(khẩn cấp|gấp|ngay|hỏa tốc)/i.test(text) ? 'URGENT' : 'PRIORITY',
                   target_facility: text.includes('Cơ sở') ? text.match(/Cơ sở \d+/)?.[0] : null
                };
             });
             if (parsedTasks.length === 0) {
                throw new Error("Không thể bóc tách công việc từ văn bản này.");
             }
             // Giả lập thời gian xử lý AI
             await new Promise(r => setTimeout(r, 800));
          } else {
             // GỌI REAL API OPENROUTER
             const systemPrompt = `Bạn là một Trợ lý Quản lý Dự án. Nhiệm vụ của bạn là đọc đoạn văn bản người dùng cung cấp và trích xuất ra danh sách các công việc cần làm.
Bạn CHỈ ĐƯỢC PHÉP trả về kết quả dưới định dạng một JSON object thuần túy. Tuyệt đối KHÔNG sử dụng markdown (như \`\`\`json), KHÔNG thêm bất kỳ câu chữ giao tiếp nào.
Hôm nay là ngày: ${new Date().toLocaleDateString()}. Hãy dùng ngày này để tính toán Hạn chót.
Cấu trúc bắt buộc:
{
  "tasks": [
    {
      "task_title": "Tên công việc ngắn gọn",
      "description": "Chi tiết công việc",
      "pic": "Tên người phụ trách (nếu có)",
      "deadline": "YYYY-MM-DD (nếu có)",
      "target_facility": "Tên cơ sở được nhắc đến (ví dụ: Cơ sở 1)",
      "priority_level": "Quét văn bản: Nếu có từ khóa 'khẩn cấp', 'gấp', 'ngay', 'hỏa tốc' -> 'URGENT'. Nếu không -> 'PRIORITY'"
    }
  ]
}`;

             console.log(`[OpenRouter API Call - Model: ${currentAiModel}] System Prompt:`, systemPrompt);

             const response = await fetch(API_URL, {
               method: 'POST',
               headers: {
                 'Content-Type': 'application/json',
                 'Authorization': `Bearer ${API_KEY}`
               },
               body: JSON.stringify({
                 model: currentAiModel,
                 response_format: { type: "json_object" },
                 messages: [
                   { role: 'system', content: systemPrompt },
                   { role: 'user', content: text }
                 ],
               })
             });

             if (!response.ok) {
               const errBody = await response.json().catch(()=>({}));
               throw new Error(`API Error ${response.status}: ${errBody.error?.message || response.statusText}`);
             }

             const data = await response.json();
             if (data.usage) {
               fetch('http://localhost:3000/api/internal/log-tokens', {
                 method: 'POST',
                 headers: {
                   'Content-Type': 'application/json',
                   'x-user-role': user?.role || '',
                   'x-facility-id': user?.facility_id || ''
                 },
                 body: JSON.stringify({
                   username: user?.name || user?.username || 'unknown',
                   prompt_tokens: data.usage.prompt_tokens || 0,
                   completion_tokens: data.usage.completion_tokens || 0,
                   total_tokens: data.usage.total_tokens || 0
                 })
               }).catch(e => console.error("Lỗi log token:", e));
             }
             let content = data.choices[0].message.content;
             
             // Clean markdown formatting if any
             content = content.replace(/```json/gi, '').replace(/```/g, '').trim();
             
             let parsedData;
             try {
                parsedData = JSON.parse(content);
             } catch (e) {
                throw new Error("AI trả về sai định dạng dữ liệu JSON.");
             }

             parsedTasks = parsedData.tasks || parsedData;
             if (!Array.isArray(parsedTasks)) {
               throw new Error('AI trả về sai định dạng dữ liệu (Không phải mảng Array).');
             }
             if (parsedTasks.length === 0) {
                throw new Error('AI không nhận diện được công việc nào từ văn bản này.');
             }
          }

          const now = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString('vi-VN');
          const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

          // Evaluate user facility ID precisely
          let taskFacilityId = 'Unknown';
          let deptTag = null;
          let picName = user?.name || 'Unknown';
          
          if (user?.role === 'SUPER_ADMIN') {
             taskFacilityId = 'HQ';
          } else if (user?.role === 'FINANCE_DEPT') {
             taskFacilityId = 'Phòng Kế Toán';
             deptTag = 'FINANCE';
             picName = 'Phòng Kế Toán';
          } else if (user?.role === 'DEPARTMENT_HEAD') {
             taskFacilityId = 'Phòng Marketing';
             deptTag = 'MARKETING';
             picName = 'Phòng Marketing';
          } else if (Array.isArray(user?.facility_id) && user.facility_id.length > 0) {
             taskFacilityId = user.facility_id[0];
          } else if (typeof user?.facility_id === 'string' && user.facility_id) {
             taskFacilityId = user.facility_id;
          }

          if (taskFacilityId === 'Unknown' || taskFacilityId === 'ALL' || !taskFacilityId) {
             if (user?.role === 'FACILITY_MANAGER' && user?.username) {
                taskFacilityId = user.username;
             } else {
                throw new Error("Không thể xác định Cơ sở (Facility ID) của bạn để tạo Task. Vui lòng kiểm tra lại tài khoản.");
             }
          }

          // Map Dữ liệu (Hydration)
          const mappedTasks = parsedTasks.map(task => ({
            id: generateId(),
            title: task.task_title || task.title || 'Task mới',
            description: task.description || '',
            pic: task.pic && task.pic !== 'Unknown' ? task.pic : picName,
            deadline: task.deadline || new Date().toISOString().split('T')[0],
            status: 'todo', // Gán mặc định status: "Cần làm"
            urgent: task.priority === 'Cao',
            facilityId: taskFacilityId,
            facility: taskFacilityId,
            department_tag: deptTag,
            historyLog: [{ time: now, event: 'AI tự động trích xuất công việc' }]
          }));

          // Cập nhật State & Lưu trữ: Nối (Concat) mảng task mới
          onConfirm(mappedTasks);
          
          // Ghi đè mảng mới xuống localStorage
          const existingTasks = JSON.parse(localStorage.getItem('kanban_tasks') || '[]');
          const newTasks = [...existingTasks, ...mappedTasks];
          localStorage.setItem('kanban_tasks', JSON.stringify(newTasks));

          // Dọn dẹp
          setText('');
          onClose();
        } catch (error) {
          console.error("Lỗi khi xử lý AI:", error);
          if (typeof showToast === 'function') {
             showToast(`❌ Lỗi: ${error.message}`);
          } else {
             alert(`Lỗi: ${error.message}`);
          }
        } finally {
          setIsAnalyzing(false);
        }
      };

      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 99999, backgroundColor: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }}>
          <div style={{ backgroundColor: 'white', width: '100%', maxWidth: '600px', borderRadius: '12px', padding: '20px', display: 'flex', flexDirection: 'column', gap: '15px', boxShadow: '0 10px 25px rgba(0,0,0,0.2)' }} className="dark:bg-[#1e1e1e]">
            <h2 style={{ margin: 0, fontSize: '18px', fontWeight: 'bold' }} className="dark:text-white">✨ Tạo nhanh bằng AI</h2>
            <p style={{ margin: 0, fontSize: '14px', color: '#666' }} className="dark:text-gray-400">Dán nội dung tin nhắn chỉ đạo hoặc biên bản họp. AI sẽ tự động phân tích và bóc tách thành các công việc cụ thể.</p>
            <textarea
              value={text}
              onChange={(e) => setText(e.target.value)}
              placeholder="VD: Hôm nay họp bàn giao..."
              style={{ width: '100%', height: '150px', padding: '10px', borderRadius: '8px', border: '1px solid #ccc', outline: 'none', resize: 'none' }}
              className="dark:bg-[#252525] dark:border-gray-700 dark:text-white"
            />
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '10px' }}>
              <button
                onClick={onClose}
                style={{ padding: '8px 16px', borderRadius: '8px', border: 'none', backgroundColor: '#f3f4f6', cursor: 'pointer', fontWeight: 'bold', color: '#333' }}
                className="dark:bg-gray-800 dark:text-white"
              >
                Hủy
              </button>
              <button
                onClick={handleAnalyze}
                disabled={!text.trim() || isAnalyzing}
                style={{ padding: '8px 16px', borderRadius: '8px', border: 'none', backgroundColor: '#8b5cf6', color: 'white', cursor: (!text.trim() || isAnalyzing) ? 'not-allowed' : 'pointer', fontWeight: 'bold', opacity: (!text.trim() || isAnalyzing) ? 0.5 : 1 }}
              >
                {isAnalyzing ? 'AI đang xử lý...' : 'Trích xuất'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ChangePasswordModal({ user, onClose, onSuccess }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [errors, setErrors] = useState({});
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const newErrors = {};
        if (!currentPassword) newErrors.current = 'Vui lòng nhập mật khẩu hiện tại';
        if (!newPassword) newErrors.new = 'Vui lòng nhập mật khẩu mới';
        if (newPassword && newPassword.length < 6) newErrors.new = 'Mật khẩu mới phải có ít nhất 6 ký tự';
        if (newPassword !== confirmPassword) newErrors.confirm = 'Xác nhận mật khẩu không khớp';

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          return;
        }

        setErrors({});
        setIsLoading(true);

        setTimeout(() => {
          const users = JSON.parse(localStorage.getItem('taskflow_users') || '[]');
          const userIdx = users.findIndex(u => u.username === user.username);
          
          if (userIdx === -1) {
            setErrors({ current: 'Không tìm thấy thông tin tài khoản' });
            setIsLoading(false);
            return;
          }

          const dbUser = users[userIdx];
          if (dbUser.password !== currentPassword && dbUser.password !== btoa(currentPassword)) {
            setErrors({ current: 'Mật khẩu hiện tại không chính xác' });
            setIsLoading(false);
            return;
          }

          users[userIdx].password = btoa(newPassword);
          localStorage.setItem('taskflow_users', JSON.stringify(users));
          
          setIsLoading(false);
          if (window.showToast) window.showToast('Đổi mật khẩu thành công!');
          onSuccess();
        }, 1200);
      };

      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in px-4">
          <div className="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col border border-gray-100 dark:border-gray-800 animate-slide-up">
            <div className="px-6 py-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-[#252525]">
              <h3 className="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2">
                <span className="material-symbols-outlined text-primary">lock_reset</span> Đổi mật khẩu
              </h3>
              <button onClick={onClose} disabled={isLoading} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
                <span className="material-symbols-outlined">close</span>
              </button>
            </div>
            
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Mật khẩu hiện tại</label>
                <input 
                  type="password" 
                  value={currentPassword}
                  onChange={(e) => setCurrentPassword(e.target.value)}
                  disabled={isLoading}
                  className={`w-full px-4 py-2.5 rounded-xl border ${errors.current ? 'border-error bg-error/5 focus:border-error focus:ring-error/20' : 'border-gray-300 dark:border-gray-700 bg-white dark:bg-[#2a2a2a] focus:border-primary focus:ring-primary/20'} outline-none transition-all dark:text-white`}
                  placeholder="Nhập mật khẩu hiện tại"
                />
                {errors.current && <p className="text-error text-xs mt-1.5">{errors.current}</p>}
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Mật khẩu mới</label>
                <input 
                  type="password" 
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                  disabled={isLoading}
                  className={`w-full px-4 py-2.5 rounded-xl border ${errors.new ? 'border-error bg-error/5 focus:border-error focus:ring-error/20' : 'border-gray-300 dark:border-gray-700 bg-white dark:bg-[#2a2a2a] focus:border-primary focus:ring-primary/20'} outline-none transition-all dark:text-white`}
                  placeholder="Nhập mật khẩu mới"
                />
                {errors.new && <p className="text-error text-xs mt-1.5">{errors.new}</p>}
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Xác nhận mật khẩu mới</label>
                <input 
                  type="password" 
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  disabled={isLoading}
                  className={`w-full px-4 py-2.5 rounded-xl border ${errors.confirm ? 'border-error bg-error/5 focus:border-error focus:ring-error/20' : 'border-gray-300 dark:border-gray-700 bg-white dark:bg-[#2a2a2a] focus:border-primary focus:ring-primary/20'} outline-none transition-all dark:text-white`}
                  placeholder="Nhập lại mật khẩu mới"
                />
                {errors.confirm && <p className="text-error text-xs mt-1.5">{errors.confirm}</p>}
              </div>

              <div className="pt-4 flex justify-end gap-3">
                <button 
                  type="button" 
                  onClick={onClose}
                  disabled={isLoading}
                  className="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl transition-colors"
                >
                  Hủy
                </button>
                <button 
                  type="submit"
                  disabled={isLoading}
                  className="px-5 py-2.5 text-sm font-medium text-white bg-primary hover:bg-primary/90 rounded-xl transition-all shadow-md shadow-primary/20 flex items-center justify-center min-w-[120px]"
                >
                  {isLoading ? <span className="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> : 'Xác nhận đổi'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) {
          if (window.showToast) window.showToast('File vượt quá dung lượng 20MB', 'error');
          return;
        }
        
        const ext = file.name.split('.').pop().toLowerCase();
        const validExts = ['jpg', 'jpeg', 'png', 'pdf', 'xlsx', 'csv'];
        if (!validExts.includes(ext)) {
          if (window.showToast) window.showToast(`Định dạng .${ext.toUpperCase()} hiện chưa được hỗ trợ. Vui lòng sử dụng JPG, PNG, PDF, XLSX hoặc CSV.`, 'error');
          return;
        }

        if (ext === 'xlsx' || ext === 'csv') {
           const reader = new FileReader();
           reader.onload = (ev) => {
              try {
                 const data = new Uint8Array(ev.target.result);
                 const workbook = window.XLSX.read(data, {type: 'array'});
                 let extractedText = '';
                 workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    extractedText += `--- Sheet: ${sheetName} ---\n`;
                    extractedText += window.XLSX.utils.sheet_to_csv(sheet).substring(0, 5000);
                 });
                 setAttachment({ name: file.name, type: file.type || ext, url: null, extractedText, isDoc: true });
              } catch (err) {
                 if (window.showToast) window.showToast('Lỗi đọc file bảng tính: ' + err.message, 'error');
              }
           };
           reader.readAsArrayBuffer(file);
        } else {
           const reader = new FileReader();
           reader.onload = (ev) => {
               const aiConfig = JSON.parse(localStorage.getItem('taskflow_ai_config') || '{}');
               if (!aiConfig.apiKey || !aiConfig.aiModel) {
                  window.showToast("Lỗi hệ thống: Chưa cấu hình Model AI hoặc API Key trong Admin", "error");
                  return;
               }
               
               let mimeType = file.type;
               if (!mimeType) {
                 if (ext === 'jpg' || ext === 'jpeg') mimeType = 'image/jpeg';
                 else if (ext === 'png') mimeType = 'image/png';
                 else if (ext === 'pdf') mimeType = 'application/pdf';
               }

               if (mimeType && mimeType.startsWith('image/')) {
                  const img = new Image();
                  img.onload = () => {
                     const canvas = document.createElement('canvas');
                     const MAX_WIDTH = 1024;
                     const MAX_HEIGHT = 1024;
                     let width = img.width;
                     let height = img.height;

                     if (width > height) {
                        if (width > MAX_WIDTH) {
                           height = Math.round((height *= MAX_WIDTH / width));
                           width = MAX_WIDTH;
                        }
                     } else {
                        if (height > MAX_HEIGHT) {
                           width = Math.round((width *= MAX_HEIGHT / height));
                           height = MAX_HEIGHT;
                        }
                     }
                     canvas.width = width;
                     canvas.height = height;
                     const ctx = canvas.getContext('2d');
                     ctx.drawImage(img, 0, 0, width, height);
                     const compressedDataUrl = canvas.toDataURL(mimeType, 0.7);
                     setAttachment({ name: file.name, type: mimeType, url: compressedDataUrl, isDoc: false });
                  };
                  img.src = ev.target.result;
               } else {
                 let base64Url = ev.target.result;
                 const dataUrlRegex = /^data:([^;]*);base64,/;
                 const match = base64Url.match(dataUrlRegex);
                 if (match) {
                   const currentMime = match[1];
                   if (!currentMime || currentMime === 'application/octet-stream' || currentMime === '') {
                      base64Url = base64Url.replace(dataUrlRegex, `data:${mimeType};base64,`);
                   }
                 }
                 setAttachment({ name: file.name, type: mimeType, url: base64Url, isDoc: false });
               }
           };
           reader.readAsDataURL(file);
        }
        e.target.value = '';
      };

                  } else {
                     try {
                        const args = toolCall.function.arguments ? JSON.parse(toolCall.function.arguments) : {};
                        const limit = args.limit || 5;
                        const statsRes = await fetch(`http://localhost:3000/api/internal/ai-token-stats?limit=${limit}`, {
                           headers: {
                              'x-user-role': props.user?.role || '',
                              'x-facility-id': props.user?.facility_id || ''
                           }
                        });
                        if (!statsRes.ok) throw new Error("API Database lỗi");
                        const statsData = await statsRes.json();
                        toolResult = JSON.stringify({ top_users: statsData.top_users });
                     } catch (e) {
                        toolResult = JSON.stringify({ error: "Không thể kết nối đến Cơ sở dữ liệu vật lý." });
                     }
                  }

                  // Gọi API lần 2 để AI tổng hợp kết quả
                  const secondResponse = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bearer ${aiConfig.apiKey}`,
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                      model: currentAiModel,
                      messages: [
                        { role: 'system', content: finalSystemPrompt },
                        ...chatLog.map(msg => ({ role: msg.role === 'ai' ? 'assistant' : 'user', content: formatContent(msg.content, msg.attachment) })),
                        { role: 'user', content: formatContent(userQuery, sentAttachment) },
                        data.choices[0].message,
                        { role: 'tool', tool_call_id: toolCall.id, name: toolCall.function.name, content: toolResult }
                      ]
                    })
                  });
                  
                  const secondData = await secondResponse.json();
                  if (secondData.usage) {
                     fetch('http://localhost:3000/api/internal/log-tokens', {
                       method: 'POST',
                       headers: {
                         'Content-Type': 'application/json',
                         'x-user-role': props.user?.role || '',
                         'x-facility-id': props.user?.facility_id || ''
                       },
                       body: JSON.stringify({
                         username: props.user?.name || props.user?.username || 'unknown',
                         prompt_tokens: secondData.usage.prompt_tokens || 0,
                         completion_tokens: secondData.usage.completion_tokens || 0,
                         total_tokens: secondData.usage.total_tokens || 0
                       })
                     }).catch(e => console.error("Lỗi log token:", e));
                  }
                  responseContent = secondData.choices && secondData.choices[0] && secondData.choices[0].message.content ? secondData.choices[0].message.content : 'Lỗi xử lý kết quả tool.';
               }
            } else {
               responseContent = data.choices && data.choices[0] && data.choices[0].message.content ? data.choices[0].message.content : 'Xin lỗi, tôi không thể xử lý yêu cầu lúc này do lỗi định dạng.';
            }
            
            // Task Creation Intent Parsing via JSON
            let isConfirmationCard = false;
            let taskPayload = null;
            let finalContent = responseContent;

            try {
                let cleanStr = responseContent.replace(/```json/gi, '').replace(/```/g, '').trim();
                const firstBrace = cleanStr.indexOf('{');
                const lastBrace = cleanStr.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace !== -1) {
                    const parsed = JSON.parse(cleanStr.substring(firstBrace, lastBrace + 1));
                    if (parsed.intent === 'create_task') {
                       isConfirmationCard = true;
                       taskPayload = parsed;
                       finalContent = 'Đang xử lý lệnh giao việc...';
                    }
                }
            } catch (e) {}

            const finalLog = [...newLogWithUser, { role: 'ai', content: finalContent, isConfirmationCard, taskPayload }];
            setChatLog(finalLog);
            saveSession(finalLog, sessionIdAfterUser);
          } catch (fetchError) {
            clearTimeout(timeoutId);
            if (fetchError.name === 'AbortError') {
              throw new Error('Kết nối API bị quá hạn (Timeout). Hệ thống AI hiện đang quá tải.');
            }
            throw fetchError;
          }
        } catch (error) {
          console.error("AI Advisor Error:", error);
          setChatLog(prev => [...prev, { role: 'ai', content: `Lỗi hệ thống: ${error.message}` }]);
        } finally {
          setIsTyping(false);
        }
      };

    // --- ERROR BOUNDARY ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex flex-col items-center justify-center h-full min-h-[400px] p-6 text-error bg-error-container/10 rounded-xl border border-error/20 m-6">
              <span className="material-symbols-outlined text-[48px] mb-4">error</span>
              <h3 className="font-bold text-xl mb-2 text-center">Đã có lỗi xảy ra khi tải giao diện</h3>
              <p className="text-sm opacity-80 font-mono mb-6 max-w-2xl text-center overflow-auto">{this.state.error?.toString()}</p>
              <button onClick={() => window.location.reload()} className="px-6 py-2.5 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors font-medium flex items-center gap-2">
                 <span className="material-symbols-outlined text-[18px]">refresh</span> Tải lại trang
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- RAG KNOWLEDGE MANAGER PANEL ---
    function RAGManagerPanel({ showToast }) {
      const [documents, setDocuments] = useState(() => {
        try { return JSON.parse(localStorage.getItem('taskflow_rag_docs') || '[]'); } catch(e) { return []; }
      });
      const [isDragging, setIsDragging] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);

      useEffect(() => {
        localStorage.setItem('taskflow_rag_docs', JSON.stringify(documents));
      }, [documents]);

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFiles(e.dataTransfer.files);
        }
      };

      const handleFileInput = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleFiles(e.target.files);
        }
      };

      const handleFiles = async (files) => {
        const file = files[0];
        if (!file) return;

        const docId = Date.now().toString();
        const initialDoc = {
          id: docId,
          name: file.name,
          type: file.type || 'text/plain',
          size: (file.size / 1024).toFixed(1) + ' KB',
          chunks: 0,
          status: 'Chờ mã hóa',
          uploadDate: new Date().toISOString()
        };
        
        setDocuments(prev => [initialDoc, ...prev]);
        setIsUploading(true);
        setUploadProgress(0);

        try {
          setDocuments(prev => prev.map(d => d.id === docId ? {...d, status: 'Đang xử lý (10%)'} : d));
          
          const fileText = await new Promise((resolve, reject) => {
             const reader = new FileReader();
             reader.onload = (e) => {
                let content = e.target.result;
                if (file.type.includes('pdf') || file.name.endsWith('.docx')) {
                   content = `Nội dung mô phỏng trích xuất từ tài liệu ${file.name}. \n` + "Đây là dữ liệu Text được bóc tách từ file PDF/DOCX để đưa vào pipeline RAG.\n".repeat(80);
                }
                resolve(content);
             };
             reader.onerror = () => reject(new Error('Failed to read file'));
             reader.readAsText(file);
          });

          setUploadProgress(30);
          setDocuments(prev => prev.map(d => d.id === docId ? {...d, status: 'Đang xử lý (30%)'} : d));

          const CHUNK_SIZE = 1000;
          const chunks = [];
          for (let i = 0; i < fileText.length; i += CHUNK_SIZE) {
             chunks.push(fileText.substring(i, i + CHUNK_SIZE));
          }
          const numChunks = chunks.length || 1;

          setUploadProgress(60);
          setDocuments(prev => prev.map(d => d.id === docId ? {...d, status: 'Đang xử lý (60%)', chunks: numChunks} : d));

          const aiConfig = JSON.parse(localStorage.getItem('taskflow_ai_config') || '{}');
          if (!aiConfig.apiKey || !aiConfig.aiModel) {
             throw new Error('Chưa cấu hình API Key/Model cho RAG');
          }

          setUploadProgress(80);
          setDocuments(prev => prev.map(d => d.id === docId ? {...d, status: 'Đang xử lý (80%)'} : d));

          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${aiConfig.apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: aiConfig.aiModel,
              messages: [
                { role: 'system', content: 'You are an embedding API simulator. Reply with JSON indicating success.' },
                { role: 'user', content: 'Embed chunk: ' + chunks[0].substring(0, 500) }
              ],
              response_format: { type: 'json_object' }
            })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || 'API OpenRouter Failed');
          }

          setUploadProgress(100);
          
          setDocuments(prev => prev.map(d => d.id === docId ? {
             ...d, 
             status: 'Đã mã hóa'
          } : d));
          if (typeof showToast !== 'undefined') showToast('Tải lên và nhúng vector thành công!');
          
        } catch (error) {
          console.error('RAG Error:', error);
          if (typeof showToast !== 'undefined') showToast('Lỗi khi mã hóa vector: ' + error.message, 'error');
          setDocuments(prev => prev.map(d => d.id === docId ? {...d, status: 'Lỗi'} : d));
        } finally {
          setIsUploading(false);
          setUploadProgress(0);
        }
      };

      const handleDelete = (id) => {

            method: 'POST',

              'Authorization': `Bearer ${apiKey.trim()}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: aiModel.trim(),
              messages: [{ role: 'user', content: 'Ping' }]
            })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));

      const [showResetModal, setShowResetModal] = useState(false);
