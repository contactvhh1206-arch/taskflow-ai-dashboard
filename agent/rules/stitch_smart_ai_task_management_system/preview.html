      const [resetPassword, setResetPassword] = useState('');
      const [isResetting, setIsResetting] = useState(false);
      const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && !window.location.protocol.includes('file');

      const handleResetSystem = () => {
         if (isProduction) return;
         if (resetConfirmText !== 'CONFIRM RESET SYSTEM') return;
         if (btoa(resetPassword) !== user.password && resetPassword !== user.password) {
            if (showToast) showToast('❌ Mật khẩu Admin không chính xác!');
            return;
         }
         
         setIsResetting(true);
         setTimeout(() => {
            try {
               // 1. Backup system configurations
               const users = JSON.parse(localStorage.getItem('taskflow_users') || '[]');
               const auth = localStorage.getItem('taskflow_auth');
               const aiConfig = localStorage.getItem('taskflow_ai_config');
               const sysPrompts = localStorage.getItem('taskflow_system_prompts');
               const kpiConfig = localStorage.getItem('taskflow_facility_kpis');

               // 2. NUCLEAR OPTION: Purge State & Cache
               localStorage.clear();
               sessionStorage.clear();
               
               // Purge Service Workers (Mock API interceptors)
               if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(registrations) {
                     for (let registration of registrations) {
                        registration.unregister();
                     }
                  });
               }
               
               // Purge Browser Cache API
               if ('caches' in window) {
                  caches.keys().then(function(names) {
                     for (let name of names) caches.delete(name);
                  });
               }
               
               // 3. Seed exact 6 standard facilities
               const seedFacilities = [
                  { id: 'f_db41', name: 'DB41', address: '', pic: '' },
                  { id: 'f_dbace', name: 'DBACE', address: '', pic: '' },
                  { id: 'f_dbpq', name: 'DBPQ', address: '', pic: '' },
                  { id: 'f_dbpa', name: 'DBPA', address: '', pic: '' },
                  { id: 'f_dbpav', name: 'DBPAV', address: '', pic: '' },
                  { id: 'f_dbpak', name: 'DBPAK', address: '', pic: '' }
               ];
               localStorage.setItem('taskflow_facilities', JSON.stringify(seedFacilities));

               // 4. Restore Users & clear their mapped facilities
               const updatedUsers = users.map(u => {
                  if (u.role === 'FACILITY_MANAGER' || (typeof u.facility_id === 'string' && u.facility_id !== 'ALL')) {
                     return { ...u, facility_id: '' };
                  }
                  return u;
               });
               localStorage.setItem('taskflow_users', JSON.stringify(updatedUsers));
               
               // 5. Restore configs
               if (auth) localStorage.setItem('taskflow_auth', auth);
               if (aiConfig) localStorage.setItem('taskflow_ai_config', aiConfig);
               if (sysPrompts) localStorage.setItem('taskflow_system_prompts', sysPrompts);
               if (kpiConfig) localStorage.setItem('taskflow_facility_kpis', kpiConfig);
               
               // 6. Transaction Commit
               console.log("[DB] TRUNCATE Tasks committed. Status 200 OK.");
               window.location.reload(true); // force reload from server
            } catch (error) {
               console.error("[DB] Lỗi Transaction:", error);
               setIsResetting(false);
               if (typeof showToast === 'function') showToast('❌ Reset thất bại (HTTP 500). Lỗi ghi xuống Backend!');
            }
         }, 2500);
      };

      useEffect(() => {
        setUsers(JSON.parse(localStorage.getItem('taskflow_users') || '[]'));
        setFacilities(JSON.parse(localStorage.getItem('taskflow_facilities') || '[]'));
      }, []);

      const saveUsers = (newUsers) => {
        setUsers(newUsers);
        localStorage.setItem('taskflow_users', JSON.stringify(newUsers));
      };

      const saveFacilities = (newFacs) => {
        setFacilities(newFacs);
        localStorage.setItem('taskflow_facilities', JSON.stringify(newFacs));
      };

      const handleAddFacility = (e) => {
        e.preventDefault();
        if (!newFacName) return;
        setIsAddingFac(true);

        setTimeout(() => {
          const newId = 'f' + Date.now();
          const selectedUser = users.find(u => u.username === newFacPic);
          const picName = selectedUser ? selectedUser.name : newFacPic;

          const newFacs = [...facilities, { id: newId, name: newFacName, address: newFacAddress, pic: picName }];
          saveFacilities(newFacs);

          if (newFacPic) {
            const updatedUsers = users.map(u => u.username === newFacPic ? { ...u, facility_id: newFacName } : u);
            saveUsers(updatedUsers);
          }

          setNewFacName(''); setNewFacAddress(''); setNewFacPic('');
          setIsAddingFac(false);
          if (showToast) showToast(`Thêm cơ sở ${newFacName} thành công!`);
        }, 800);
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newUsername || !newPassword || !newName) return;
        if (users.find(u => u.username === newUsername)) {
          alert('Tài khoản đã tồn tại!');
          return;
        }
        const newUser = {
          id: 'u' + Date.now(),
          username: newUsername,
          password: btoa(newPassword),
          name: newName,
          role: newRole,
          facility_id: ['FINANCE_DEPT', 'DEPARTMENT_HEAD'].includes(newRole) ? newFinanceFacilities : HIGH_LEVEL_ROLES.includes(newRole) ? 'ALL' : newFacilityId,
          isActive: true
        };
        const newUsers = [...users, newUser];
        saveUsers(newUsers);
        setNewUsername(''); setNewPassword(''); setNewName('');
      };

      const openEditModal = (fac) => {
        setEditingFac(fac);
        setEditFacName(fac.name);
        setEditFacAddress(fac.address || '');
        const picUser = users.find(u => u.name === fac.pic);
        setEditFacPic(picUser ? picUser.username : '');
      };

      const handleUpdateFacility = (e) => {
        e.preventDefault();
        setIsUpdatingFac(true);
        setTimeout(() => {
          const oldPicName = editingFac.pic;
          const selectedUser = users.find(u => u.username === editFacPic);
          const newPicName = selectedUser ? selectedUser.name : '';

          const updatedFacs = facilities.map(f => f.id === editingFac.id ? { ...f, name: editFacName, address: editFacAddress, pic: newPicName } : f);
          saveFacilities(updatedFacs);

          let updatedUsers = [...users];
          const oldPicUser = users.find(u => u.name === oldPicName);
          if (oldPicUser && oldPicUser.username !== editFacPic) {
            updatedUsers = updatedUsers.map(u => u.username === oldPicUser.username ? { ...u, facility_id: 'Cơ sở 1' } : u);
          }
          if (editFacPic) {
            updatedUsers = updatedUsers.map(u => u.username === editFacPic ? { ...u, facility_id: editFacName } : u);
          }
          saveUsers(updatedUsers);

          setIsUpdatingFac(false);
          setEditingFac(null);
          if (showToast) showToast(`Cập nhật cơ sở ${editFacName} thành công!`);
        }, 800);
      };

      const handleDeleteFacility = () => {
        if (!deletingFac) return;
        const openTasks = tasks?.filter(t => t.facility === deletingFac.name && t.status !== 'done' && t.status !== 'revoked') || [];
        if (openTasks.length > 0) {
          if (showToast) showToast(`❌ Lỗi: Cơ sở đang có ${openTasks.length} công việc chưa hoàn thành! Không thể xóa.`);
          setDeletingFac(null);
          return;
        }
        const updatedFacs = facilities.map(f => f.id === deletingFac.id ? { ...f, is_deleted: true } : f);
        saveFacilities(updatedFacs);
        setDeletingFac(null);
        if (showToast) showToast(`Đã xóa cơ sở ${deletingFac.name}`);
      };

      const handleDeleteUser = () => {
        if (!deletingUser) return;
        if (deletingUser.id === user.id) {
           if (showToast) showToast('❌ Lỗi 403 Forbidden: Không thể tự xóa chính mình!');
           setDeletingUser(null);
           return;
        }

        // 1. Cascade Delete Tasks
        if (setTasks) {
          setTasks(prev => prev.filter(t => t.pic !== deletingUser.username && t.pic !== deletingUser.name));
        }

        // 2. Cascade Delete Comments (Chat Logs)
        if (setTaskComments) {
          setTaskComments(prev => {
            const newComments = {};
            Object.keys(prev).forEach(taskId => {
              newComments[taskId] = prev[taskId].filter(c => c.sender !== deletingUser.name && c.sender !== deletingUser.username);
            });
            return newComments;
          });
        }

        // 3. Xóa các bản ghi Check_in (nếu có)
        try {
           const checkins = JSON.parse(localStorage.getItem('taskflow_checkins') || '[]');
           const newCheckins = checkins.filter(c => c.username !== deletingUser.username && c.userId !== deletingUser.id);
           localStorage.setItem('taskflow_checkins', JSON.stringify(newCheckins));
        } catch(e) {}

        // 4. Hard Delete User
        const updatedUsers = users.filter(u => u.id !== deletingUser.id);
        saveUsers(updatedUsers);

        setDeletingUser(null);
        if (showToast) showToast(`Đã dọn dẹp sạch sẽ tài khoản ${deletingUser.username} và toàn bộ dữ liệu liên quan`);
      };

      const handleUpdateUser = (e) => {
        e.preventDefault();
        if (!editingUser) return;

        if (editingUser.id === user.id && editUserRole !== user.role && (user.role === 'ADMIN' || user.role === 'SUPER_ADMIN')) {
          if (showToast) showToast('❌ Lỗi: Bạn không thể tự thay đổi quyền của chính mình!');
          return;
        }

        const updatedUsers = users.map(u => {
          if (u.id === editingUser.id) {
            return {
              ...u,
              name: editUserName,
              role: editUserRole,
              facility_id: ['FINANCE_DEPT', 'DEPARTMENT_HEAD'].includes(editUserRole) ? editFinanceFacilities : HIGH_LEVEL_ROLES.includes(editUserRole) ? 'ALL' : editUserFacility,
              password: editUserPassword ? btoa(editUserPassword) : u.password
            };
          }
          return u;
        });
        saveUsers(updatedUsers);
        setEditingUser(null);
        if (showToast) showToast(`Cập nhật thành công tài khoản ${editingUser.username}`);
      };

      const toggleUserActive = (userId) => {
        if (userId === user.id) {
           if (showToast) showToast('❌ Lỗi 403 Forbidden: Không thể tự khóa chính mình!');
           return;
        }
        const newUsers = users.map(u => u.id === userId ? { ...u, isActive: !u.isActive } : u);
        saveUsers(newUsers);
      };

      return (
        <div className="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border border-outline-variant dark:border-gray-800 animate-fade-in flex flex-col h-[75vh]">
          <div className="p-4 border-b border-outline-variant dark:border-gray-800 bg-gradient-to-r from-primary/10 to-transparent flex gap-4">
            <button onClick={() => setActiveTab('facilities')} className={`px-4 py-2 rounded-lg font-bold transition-all ${activeTab === 'facilities' ? 'bg-primary text-white shadow-md' : 'text-gray-500 hover:bg-surface-variant dark:hover:bg-gray-800'}`}>Quản lý Cơ sở</button>
            <button onClick={() => setActiveTab('users')} className={`px-4 py-2 rounded-lg font-bold transition-all ${activeTab === 'users' ? 'bg-primary text-white shadow-md' : 'text-gray-500 hover:bg-surface-variant dark:hover:bg-gray-800'}`}>Quản lý Tài khoản</button>
            {user.role === 'ADMIN' && (
               <button onClick={() => setActiveTab('maintenance')} className={`px-4 py-2 rounded-lg font-bold transition-all ${activeTab === 'maintenance' ? 'bg-error text-white shadow-md' : 'text-error hover:bg-error/10 border border-transparent dark:hover:bg-red-900/20'}`}>Cấu hình Nâng cao / Bảo trì</button>
            )}
          </div>
          <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
            {activeTab === 'facilities' ? (
              <div className="space-y-6">
                <div className="bg-surface-container-low dark:bg-[#252525] p-5 rounded-xl border border-outline-variant dark:border-gray-700">
                  <h3 className="font-bold mb-4 dark:text-white flex items-center gap-2"><span className="material-symbols-outlined text-primary">add_circle</span> Thêm cơ sở mới</h3>
                  <form onSubmit={handleAddFacility} className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Tên cơ sở *</label>
                      <input required type="text" value={newFacName} onChange={e => setNewFacName(e.target.value)} className="w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Địa chỉ</label>
                      <input type="text" value={newFacAddress} onChange={e => setNewFacAddress(e.target.value)} className="w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Quản lý phụ trách (PIC)</label>
                      <select value={newFacPic} onChange={e => setNewFacPic(e.target.value)} className="w-full pl-3 pr-8 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors text-ellipsis overflow-hidden whitespace-nowrap">
                        <option value="">-- Chưa phân công --</option>
                        {users.filter(u => u.role === 'FACILITY_MANAGER').map(u => (
                          <option key={u.id} value={u.username}>{u.name} ({u.username})</option>
                        ))}
                      </select>
                    </div>
                    <button type="submit" disabled={isAddingFac} className="bg-primary hover:bg-primary/90 disabled:opacity-50 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md shadow-primary/20 flex justify-center items-center h-[38px] gap-2 transition-all">
                      {isAddingFac ? <span className="material-symbols-outlined text-[18px] animate-spin">progress_activity</span> : <span className="material-symbols-outlined text-[18px]">save</span>} Lưu
                    </button>
                  </form>
                </div>
                <div>
                  <h3 className="font-bold mb-3 dark:text-white flex items-center gap-2"><span className="material-symbols-outlined text-secondary">corporate_fare</span> Danh sách Cơ sở ({facilities.filter(f => !f.is_deleted).length})</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {facilities.filter(f => !f.is_deleted).map(f => (
                      <div key={f.id} className="p-4 rounded-xl border border-outline-variant dark:border-gray-700 bg-white dark:bg-[#1a1a1a] flex flex-col gap-3 shadow-sm hover:shadow-md transition-shadow relative group">
                        <div className="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button onClick={() => openEditModal(f)} className="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors"><span className="material-symbols-outlined text-[16px]">edit</span></button>
                          <button onClick={() => setDeletingFac(f)} className="w-8 h-8 rounded-full bg-error-container/50 dark:bg-error-container/20 text-error flex items-center justify-center hover:bg-error-container dark:hover:bg-error-container/40 transition-colors"><span className="material-symbols-outlined text-[16px]">delete</span></button>
                        </div>
                        <div className="flex justify-between items-start pr-16">
                          <span className="font-bold text-primary dark:text-blue-400">{f.name}</span>
                          <span className="text-[10px] bg-gray-100 dark:bg-[#252525] border border-gray-200 dark:border-gray-700 px-1.5 py-0.5 rounded text-gray-500 font-mono">{f.id}</span>
                        </div>
                        <div className="text-xs text-gray-600 dark:text-gray-300 flex items-center gap-2"><span className="material-symbols-outlined text-[14px]">location_on</span> {f.address || 'Chưa cập nhật'}</div>
                        <div className="text-xs text-gray-600 dark:text-gray-300 flex items-center gap-2"><span className="material-symbols-outlined text-[14px]">person</span> {f.pic || 'Chưa có PIC'}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : activeTab === 'users' ? (
              <div className="space-y-6">
                <div className="bg-surface-container-low dark:bg-[#252525] p-5 rounded-xl border border-outline-variant dark:border-gray-700">
                  <h3 className="font-bold mb-4 dark:text-white flex items-center gap-2"><span className="material-symbols-outlined text-primary">person_add</span> Thêm Tài khoản mới</h3>
                  <form onSubmit={handleAddUser} className="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Username *</label>
                      <input required type="text" value={newUsername} onChange={e => setNewUsername(e.target.value)} className="w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Password *</label>
                      <input required type="text" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Họ tên *</label>
                      <input required type="text" value={newName} onChange={e => setNewName(e.target.value)} className="w-full px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Vai trò</label>
                      <select
                        value={newRole}
                        onChange={e => {
                          setNewRole(e.target.value);
                          if (HIGH_LEVEL_ROLES.includes(e.target.value)) setNewFacilityId('ALL');
                        }}
                        className="w-full pl-3 pr-8 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors text-ellipsis overflow-hidden whitespace-nowrap"
                      >
                        {SYSTEM_ROLES.map(role => (
                          <option key={role.value} value={role.value}>{role.label}</option>
                        ))}
                      </select>
                    </div>
                    {['FINANCE_DEPT', 'DEPARTMENT_HEAD'].includes(newRole) ? (
                      <div>
                        <label className="block text-xs font-medium text-gray-500 mb-1">Phân quyền cơ sở (RLS)</label>
                        <div className="flex flex-wrap gap-x-4 gap-y-2 border border-gray-300 dark:border-gray-600 rounded-lg p-2 max-h-[80px] overflow-y-auto custom-scrollbar">
                          <label className="flex items-center gap-1.5 text-xs font-medium dark:text-white cursor-pointer select-none">
                            <input type="checkbox" className="accent-primary w-3.5 h-3.5" checked={newFinanceFacilities.includes('ALL')} onChange={e => {
                              if (e.target.checked) setNewFinanceFacilities(['ALL']);
                              else setNewFinanceFacilities([]);
                            }} />
                            [Tất cả]
                          </label>
                          {facilities.map(f => (
                            <label key={f.id} className="flex items-center gap-1.5 text-xs font-medium dark:text-white cursor-pointer select-none">
                              <input type="checkbox" className="accent-primary w-3.5 h-3.5" checked={newFinanceFacilities.includes('ALL') || newFinanceFacilities.includes(f.name)} onChange={e => {
                                if (e.target.checked) {
                                  const arr = newFinanceFacilities.filter(x => x !== 'ALL');
                                  setNewFinanceFacilities([...arr, f.name]);
                                } else {
                                  setNewFinanceFacilities(newFinanceFacilities.filter(x => x !== 'ALL' && x !== f.name));
                                }
                              }} />
                              {f.name}
                            </label>
                          ))}
                        </div>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-xs font-medium text-gray-500 mb-1">Cơ sở</label>
                        <select disabled={HIGH_LEVEL_ROLES.includes(newRole)} value={HIGH_LEVEL_ROLES.includes(newRole) ? 'ALL' : newFacilityId} onChange={e => setNewFacilityId(e.target.value)} className="w-full pl-3 pr-8 py-2 bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-primary dark:text-white transition-colors disabled:opacity-50 text-ellipsis overflow-hidden whitespace-nowrap">
                          <option value="ALL">ALL</option>
                          {facilities.length === 0 ? <option value="Cơ sở 1">Cơ sở 1</option> : facilities.map(f => <option key={f.id} value={f.name}>{f.name}</option>)}
                        </select>
                      </div>
                    )}
                    <button type="submit" className="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md shadow-primary/20 flex justify-center items-center h-[38px] gap-2 transition-all">
                      <span className="material-symbols-outlined text-[18px]">add</span> Thêm
                    </button>
                  </form>
                </div>
                <div>
                  <h3 className="font-bold mb-3 dark:text-white flex items-center gap-2"><span className="material-symbols-outlined text-secondary">manage_accounts</span> Danh sách Tài khoản Hệ thống ({users?.filter(u => u && !u.is_deleted)?.length || 0})</h3>
                  <div className="overflow-x-auto rounded-xl border border-outline-variant dark:border-gray-700">
                    <ErrorBoundary>
                      <table className="w-full text-sm text-left">
                        <thead className="text-xs text-gray-500 uppercase bg-surface-container-low dark:bg-gray-800 border-b border-outline-variant dark:border-gray-700">
                          <tr>
                            <th className="px-5 py-3">Tài khoản</th>
                            <th className="px-5 py-3">Tên & Vai trò</th>
                            <th className="px-5 py-3">Cơ sở</th>
                            <th className="px-5 py-3">Trạng thái</th>
                            <th className="px-5 py-3 text-right">Thao tác</th>
                          </tr>
                        </thead>
                        <tbody>
                          {users?.filter(u => u && !u.is_deleted)?.map(u => (
                            <tr key={u.id} className="border-b last:border-b-0 border-outline-variant dark:border-gray-700 bg-white dark:bg-[#1a1a1a] hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                              <td className="px-5 py-4 font-mono text-gray-600 dark:text-gray-300 font-medium">{u?.username}</td>
                              <td className="px-5 py-4">
                                <div className="font-bold text-gray-800 dark:text-white">{u?.name}</div>
                                <div className="text-[10px] bg-primary/10 text-primary border border-primary/20 w-fit px-2 py-0.5 rounded mt-1 font-bold inline-flex items-center gap-1">
                                  {SYSTEM_ROLES.find(r => r.value === u?.role)?.label || u?.role}
                                </div>
                              </td>
                              <td className="px-5 py-4"><span className="font-medium text-xs dark:text-gray-300">{Array.isArray(u?.facility_id) ? u.facility_id.join(', ') : u?.facility_id}</span></td>
                              <td className="px-5 py-4">
                                {u?.isActive ? <span className="bg-success/10 text-success border border-success/20 px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-success"></span>Hoạt động</span> : <span className="bg-error/10 text-error border border-error/20 px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-error"></span>Đã Khóa</span>}
                              </td>
                              <td className="px-5 py-4 text-right">
                                  <div className="flex items-center justify-end gap-2 ml-auto">
                                    <button onClick={() => toggleUserActive(u.id)} disabled={u.id === user.id} className={`px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition-all flex items-center gap-1 border ${u.isActive ? 'bg-error-container text-error border-error/30 hover:bg-red-200 dark:bg-red-900/20 dark:border-red-800/30 dark:hover:bg-red-900/40' : 'bg-success/10 text-success border-success/30 hover:bg-green-200 dark:bg-green-900/20 dark:border-green-800/30 dark:hover:bg-green-900/40'} ${u.id === user.id ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                      {u.isActive ? <><span className="material-symbols-outlined text-[14px]">lock</span> Khóa</> : <><span className="material-symbols-outlined text-[14px]">lock_open</span> Mở khóa</>}
                                    </button>
                                    <button onClick={() => {
                                      setEditingUser(u);
                                      setEditUserName(u.name);
                                      setEditUserRole(u.role);
                                      setEditUserFacility(u.facility_id);
                                      setEditFinanceFacilities(Array.isArray(u.facility_id) ? u.facility_id : [u.facility_id || 'ALL']);
                                      setEditUserPassword('');
                                    }} className="px-3 py-2 rounded-lg text-xs font-bold shadow-sm transition-all flex items-center justify-center border bg-blue-100 text-blue-600 border-blue-300 hover:bg-blue-200 dark:bg-blue-900/20 dark:border-blue-800/30 dark:hover:bg-blue-900/40">
                                      <span className="material-symbols-outlined text-[16px]">edit</span>
                                    </button>
                                    <button onClick={() => setDeletingUser(u)} disabled={u.id === user.id} className={`px-3 py-2 rounded-lg text-xs font-bold shadow-sm transition-all flex items-center justify-center border bg-error/10 text-error border-error/30 hover:bg-error-container dark:bg-red-900/20 dark:border-red-800/30 dark:hover:bg-red-900/40 ${u.id === user.id ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                      <span className="material-symbols-outlined text-[16px]">delete</span>
                                    </button>
                                  </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </ErrorBoundary>
                  </div>
                </div>
              </div>

    // --- FACILITY DASHBOARD COMPONENT ---
    function FacilityDashboard({ user, tasks, onNavigate, onOpenTask, globalFacilityFilter }) {
      const [stats, setStats] = useState({ open: 0, closed: 0, overdue: 0, total: -1, error: false });
      const [urgentTasks, setUrgentTasks] = useState([]);
      const [aiPings, setAiPings] = useState([]);
      const [recentLogs, setRecentLogs] = useState([]);
      const [timeFilter, setTimeFilter] = useState('today');
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        if (!user?.facility_name && !['DEPARTMENT_HEAD', 'FINANCE_DEPT', 'SUPER_ADMIN'].includes(user?.role)) {
           setIsLoading(true);
           const fallback = setTimeout(() => setIsLoading(false), 3000);
           return () => clearTimeout(fallback);
        }
        setIsLoading(true);
        const timer = setTimeout(() => {
          try {
            // Safe array fallback and Row-level security
            const safeTasks = Array.isArray(tasks) ? tasks : [];
            const isHighLevel = user?.role !== 'DEPARTMENT_HEAD' && (user?.facility_id === 'ALL' || ['SUPER_ADMIN', 'VICE_PRESIDENT', 'GENERAL_MANAGER', 'ADMIN'].includes(user?.role));
            const facCode = (user?.facility_code || '').toLowerCase();
            const isDeptHead = ['DEPARTMENT_HEAD', 'FINANCE_DEPT'].includes(user?.role);
            const deptId = user?.department_id || (user?.username === 'marketing' ? 'MARKETING' : (user?.role === 'FINANCE_DEPT' ? 'FINANCE' : ''));
            
            const myTasks = safeTasks.filter(t => {
               if (isHighLevel) return true;
               if (isDeptHead) {
                  const tTitle = (t.title || '').toLowerCase();
                  return t.department_tag === deptId || t.pic === user?.name || t.picId === user?.username || (deptId === 'MARKETING' && (tTitle.includes('marketing') || tTitle.includes('ads') || tTitle.includes('quảng cáo') || tTitle.includes('kịch bản') || tTitle.includes('video'))) || (deptId === 'FINANCE' && (tTitle.includes('doanh thu') || tTitle.includes('kế toán') || tTitle.includes('tài chính')));
               }
               const tFac = (t?.facilityId || t?.facility || '').toLowerCase();
               return tFac === facCode || tFac === user?.username?.toLowerCase();
            });

            const now = new Date();
            let startOfFrame = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            let endOfFrame = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);

            if (timeFilter === 'week') {
              const day = now.getDay() || 7;
              startOfFrame = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 1, 0, 0, 0);
              endOfFrame = new Date(startOfFrame.getFullYear(), startOfFrame.getMonth(), startOfFrame.getDate() + 6, 23, 59, 59);
            } else if (timeFilter === 'month') {
              startOfFrame = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
              endOfFrame = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
            }

            const startMs = startOfFrame.getTime();
            const endMs = endOfFrame.getTime();

            const getCreatedTime = (t) => {
              try {
                if (t?.historyLog?.length > 0) {
                  const match = t.historyLog[0]?.time?.match(/(\d+):(\d+) - (\d+)\/(\d+)\/(\d+)/);
                  if (match) return new Date(match[5], match[4] - 1, match[3], match[1], match[2]).getTime();
                }
              } catch (e) { }
              return now.getTime();
            };

            const getCompletedTime = (t) => {
              if (t?.completedAtReal) return new Date(t.completedAtReal).getTime();
              if (t?.completedAt) return new Date(t.completedAt).getTime();
              return t?.deadline ? new Date(t.deadline).getTime() : now.getTime();
            };

            const getDeadlineTime = (t) => {
              if (!t?.deadline || typeof t.deadline !== 'string') return 0;
              const [y, m, d] = t.deadline.split('-');
              if (!y || !m || !d) return 0;
              return new Date(y, m - 1, d, 23, 59, 59).getTime();
            };

            const openCount = myTasks.filter(t => {
              if (t?.status === 'done' || t?.status === 'revoked') return false;
              const cTime = getCreatedTime(t);
              return cTime >= startMs && cTime <= endMs;
            }).length;

            const closedCount = myTasks.filter(t => {
              if (t?.status !== 'done') return false;
              const compTime = getCompletedTime(t);
              return compTime >= startMs && compTime <= endMs;
            }).length;

            const overdueCount = myTasks.filter(t => {
              const dTime = getDeadlineTime(t);
              if (dTime === 0) return false;
              if (dTime < startMs || dTime > endMs) return false;

              if (t?.status !== 'done' && t?.status !== 'revoked') {
                return dTime < now.getTime();
              }
              if (t?.status === 'done') {
                const compTime = getCompletedTime(t);
                return compTime > dTime;
              }
              return false;
            }).length;

            setStats({ open: openCount ?? 0, closed: closedCount ?? 0, overdue: overdueCount ?? 0, total: myTasks.length });

            const todayStr = new Date().toISOString().split('T')[0];
            const urgent = myTasks.filter(t => t?.status !== 'done' && t?.status !== 'revoked' && (t?.urgent || t?.pinned || (t?.deadline && t.deadline <= todayStr)));
            setUrgentTasks(urgent || []);

            // Generate Empathetic AI Pings based on urgent tasks for this user
            const sysPrompts = JSON.parse(localStorage.getItem('taskflow_system_prompts') || '{}');

    function HeatmapKPI({ user, facilityList, selectedMonth, refreshToggle }) {
       const [dailyData, setDailyData] = React.useState({});
       const [weeklyData, setWeeklyData] = React.useState([]);
       const [expandedWeeks, setExpandedWeeks] = React.useState({ 1: true, 2: true, 3: true, 4: true, 5: true });
       const [loading, setLoading] = React.useState(true);
       
       const [yearStr, monthStr] = selectedMonth.split('-');
       const formattedMonthStr = `${monthStr}/${yearStr}`;

       React.useEffect(() => {
          setLoading(true);
          setTimeout(() => {
             const allReports = JSON.parse(localStorage.getItem('taskflow_daily_financial_reports') || '[]');
             const year = parseInt(yearStr, 10);
             const month = parseInt(monthStr, 10) - 1;
             
             const daysInMonth = new Date(year, month + 1, 0).getDate();
             
             const defaultFacs = facilityList.length > 0 ? facilityList : Array.from({length: 6}, (_, i) => ({id: `f${i+1}`, name: `Cơ sở ${i+1}`}));
             
             const matrix = {};
             for (let i = 1; i <= daysInMonth; i++) {
                matrix[i] = {};
                defaultFacs.forEach(f => { matrix[i][f.name] = 0; });
             }
             
             allReports.forEach(r => {
                const parts = r.date.split('-');
                const rYear = parseInt(parts[0], 10);
                const rMonth = parseInt(parts[1], 10) - 1;
                const rDay = parseInt(parts[2], 10);
                
                if (rYear === year && rMonth === month && matrix[rDay]) {
                   if (r.data && Array.isArray(r.data)) {
                      r.data.forEach(facData => {
                         if (matrix[rDay][facData.name] !== undefined) {
                            matrix[rDay][facData.name] += Number(facData.revenue || 0);
                         }
                      });
                   }
                }
             });

             const weeks = [
                { id: 1, label: 'TUẦN 1 (01-07)', start: 1, end: 7, sums: {} },
                { id: 2, label: 'TUẦN 2 (08-14)', start: 8, end: 14, sums: {} },
                { id: 3, label: 'TUẦN 3 (15-21)', start: 15, end: 21, sums: {} },
                { id: 4, label: 'TUẦN 4 (22-28)', start: 22, end: 28, sums: {} }
             ];
             if (daysInMonth > 28) {
                const endDay = daysInMonth;
                let rangeLabel = `29-30`;
                if (endDay === 31) rangeLabel = `29-30-31`;
                if (endDay === 29) rangeLabel = `29`;
                weeks.push({ id: 5, label: `TUẦN 5 (${rangeLabel})`, start: 29, end: daysInMonth, sums: {} });
             }
             
             weeks.forEach(w => {
                 defaultFacs.forEach(f => {
                    w.sums[f.name] = 0;
                    for (let i = w.start; i <= w.end; i++) {
                       w.sums[f.name] += matrix[i][f.name];
                    }
                 });
             });

             setDailyData(matrix);
             setWeeklyData(weeks);
             setLoading(false);
          }, 300);
       }, [facilityList, selectedMonth]);

       const getTarget = (facName, isWeekend) => {
          const savedKpis = JSON.parse(localStorage.getItem('taskflow_facility_kpis') || '{}');
          const facilityKpi = Object.values(savedKpis).find(k => k.name === facName);
          
          if (facilityKpi) {
             return isWeekend ? Number(facilityKpi.weekend_target) : Number(facilityKpi.weekday_target);
          }
          return isWeekend ? 8000000 : 5000000;
       };

       const defaultFacs = facilityList.length > 0 ? facilityList : Array.from({length: 6}, (_, i) => ({id: `f${i+1}`, name: `Cơ sở ${i+1}`}));
       const isAllowedAll = ['SUPER_ADMIN', 'VICE_PRESIDENT', 'ADMIN', 'FINANCE_DEPT', 'DEPARTMENT_HEAD'].includes(user.role);
       const allowedFacs = Array.isArray(user.facility_id) ? user.facility_id : [user.facility_id];
       const hasAll = allowedFacs.includes('ALL');

       const visibleFacs = defaultFacs.filter(f => isAllowedAll || hasAll || allowedFacs.includes(f.id) || allowedFacs.includes(f.name));

       if (loading) {
         return (
           <div className="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm shrink-0 mt-2 h-64 flex items-center justify-center">
              <div className="w-8 h-8 border-4 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
           </div>
         );
       }

       return (
          <div className="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm shrink-0 mt-2 flex flex-col">
             <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h3 className="font-bold text-gray-800 dark:text-gray-200 flex items-center gap-2 shrink-0">
                  <span className="material-symbols-outlined text-teal-600">grid_on</span>
                  Heatmap KPI Doanh Thu (Tháng {formattedMonthStr})
                </h3>
                <div className="flex gap-4 text-xs font-medium">
                  <span className="flex items-center gap-1"><span className="w-3 h-3 bg-green-100 dark:bg-green-900/30 border border-green-300 dark:border-green-800 inline-block rounded"></span> Đạt KPI</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 inline-block rounded"></span> Dưới KPI</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 bg-gray-50 dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 inline-block rounded"></span> Chưa có số</span>
                </div>
             </div>
             
             <div className="overflow-auto custom-scrollbar relative max-h-[500px] border border-gray-200 dark:border-gray-700 rounded-lg">
                <table className="w-full text-sm text-center border-collapse min-w-[800px]">
                   <thead className="bg-gray-100 dark:bg-[#252525] sticky top-0 z-20 shadow-sm">
                     <tr>
                       <th className="px-4 py-3 border border-gray-200 dark:border-gray-700 font-bold sticky left-0 bg-gray-100 dark:bg-[#252525] z-30 min-w-[120px]">
                         Ngày
                       </th>
                       {visibleFacs.map(fac => (
                         <th key={fac.name} className="px-4 py-3 border border-gray-200 dark:border-gray-700 font-bold">
                           {fac.name}
                         </th>
                       ))}
                     </tr>
                   </thead>
                   <tbody>
                     {weeklyData.map(week => (
                        <React.Fragment key={`week-${week.id}`}>
                           <tr onClick={() => setExpandedWeeks(prev => ({...prev, [week.id]: !prev[week.id]}))} className="cursor-pointer bg-orange-500 hover:bg-orange-600 dark:bg-[#d95d1e] dark:hover:bg-[#c24f15] text-white transition-colors group select-none">
                              <td className="px-4 py-3 border border-orange-600 dark:border-orange-800 font-bold sticky left-0 z-10 bg-orange-500 group-hover:bg-orange-600 dark:bg-[#d95d1e] dark:group-hover:bg-[#c24f15] whitespace-nowrap text-left transition-colors">
                                 <div className="flex items-center justify-between">
                                    <span>{week.label}</span>
                                    <span className="material-symbols-outlined text-[18px]">{expandedWeeks[week.id] ? 'expand_less' : 'expand_more'}</span>
                                 </div>
                              </td>
                              {visibleFacs.map(fac => (
                                 <td key={`week-sum-${fac.name}`} className="px-4 py-3 border border-orange-600 dark:border-orange-800 font-bold">
                                     {week.sums[fac.name] > 0 ? new Intl.NumberFormat('vi-VN').format(week.sums[fac.name]) : '-'}
                                 </td>
                              ))}
                           </tr>
                           {expandedWeeks[week.id] && Array.from({length: week.end - week.start + 1}, (_, i) => week.start + i).map(d => {
                              const dateObj = new Date(parseInt(yearStr, 10), parseInt(monthStr, 10) - 1, d);
                              const dayOfWeek = dateObj.getDay(); 
                              const isWeekend = dayOfWeek === 5 || dayOfWeek === 6; 
                              const dayLabel = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][dayOfWeek];
                              
                              return (
                                <tr key={d}>
                                  <td className={`px-4 py-2 border border-gray-200 dark:border-gray-700 font-medium sticky left-0 z-10 whitespace-nowrap ${isWeekend ? 'bg-orange-50 dark:bg-orange-900/20 text-orange-700 dark:text-orange-400' : 'bg-gray-50 dark:bg-[#1a1a1a]'}`}>
                                    {d}/{monthStr} ({dayLabel})
                                  </td>
                                  {visibleFacs.map(fac => {
                                     const rev = dailyData[d][fac.name];
                                     const target = getTarget(fac.name, isWeekend);
                                     const isMet = rev >= target;
                                     const hasData = rev > 0;
                                     
                                     let bgColorClass = 'bg-white dark:bg-[#1e1e1e] text-gray-400';
                                     if (hasData) {
                                        bgColorClass = isMet ? 'bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-400 font-bold' : 'bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400';
                                     }

                                     return (
                                       <td key={fac.name} className={`px-4 py-2 border border-gray-200 dark:border-gray-700 transition-colors ${bgColorClass}`}>
                                          <div className="flex flex-col items-center group relative cursor-pointer">
                                             <span>{hasData ? new Intl.NumberFormat('vi-VN').format(rev) : '-'}</span>
                                             {hasData && (
                                                <div className="absolute bottom-full mb-2 bg-gray-900 text-white text-[11px] px-3 py-2 rounded opacity-0 group-hover:opacity-100 transition-opacity z-40 whitespace-nowrap pointer-events-none shadow-lg">
                                                   <strong>{fac.name} - Ngày {d}</strong><br/>
                                                   Target KPI: {new Intl.NumberFormat('vi-VN').format(target)}<br/>
                                                   Thực tế: {new Intl.NumberFormat('vi-VN').format(rev)}<br/>
                                                   <span className={isMet ? 'text-green-400' : 'text-red-400'}>
                                                     {isMet ? '✅ Vượt chỉ tiêu' : '❌ Chưa đạt'}
                                                   </span>
                                                </div>
                                             )}
                                          </div>
                                       </td>
                                     );
                                  })}
                                </tr>
                              );
                           })}
                        </React.Fragment>
                     ))}
                   </tbody>
                </table>
             </div>
          </div>
       );
    }

    function RevenueOverviewDashboard({ user, facilityList }) {
      const [selectedMonth, setSelectedMonth] = React.useState(new Date().toISOString().substring(0, 7));
      const [data, setData] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [refreshToggle, setRefreshToggle] = React.useState(0);
      
      const [aiLoading, setAiLoading] = React.useState(false);
      const [aiError, setAiError] = React.useState('');
      const [batchData, setBatchData] = React.useState(null);
      const fileInputRef = React.useRef(null);

      const handleAIExtractClick = () => {
         fileInputRef.current?.click();
      };

      const processAIExtract = async (e) => {
         const file = e.target.files?.[0];
         if (!file) return;
         
         setAiLoading(true);
         setAiError('');
         try {
            const isImage = file.type.startsWith('image/');
            let contentData = '';

            if (isImage) {
               contentData = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onloadend = () => resolve(reader.result);
                  reader.readAsDataURL(file);
               });
               const response = await fetch('http://localhost:3000/api/internal/extract-revenue', {
                  method: 'POST',
                  headers: {
                     'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ imageBase64: contentData })
               });
               
               if (!response.ok) throw new Error("API Request Failed");
               const responseJson = await response.json();
               
               if (responseJson.success) {
                  // Normalize dates returned by AI from DD/MM/YYYY to YYYY-MM-DD
                  const normalizedData = responseJson.data.map(item => {
                     let d = item.date;
                     if (d && d.includes('/')) {
                        const parts = d.split('/');
                        if (parts.length === 3) {
                           d = `${parts[2].length === 2 ? '20'+parts[2] : parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                     }
                     return { ...item, date: d };
                  });
                  setBatchData(normalizedData);
               } else {
                  throw new Error(responseJson.error || "Lỗi xử lý AI từ máy chủ.");
               }
               
            } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.csv')) {
               const rawJsonData = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                     const data = new Uint8Array(e.target.result);
                     const workbook = window.XLSX.read(data, {type: 'array'});
                     const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                     const jsonData = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false });
                     // Limit to first 100 rows to save tokens and time
                     resolve(jsonData.slice(0, 100));
                  };
                  reader.readAsArrayBuffer(file);
               });
               
               // DYNAMIC PROMPT INJECTION
               const facNames = facilityList.map(f => f.name).join(', ');
               const systemPrompt = `Bạn là trợ lý kế toán. Hãy quét file Excel được cung cấp và bóc tách số liệu doanh thu. Hãy KHỚP CHÍNH XÁC số liệu vào các chi nhánh hiện có sau đây của hệ thống: [${facNames}]. Tuyệt đối không tự bịa ra tên chi nhánh khác. Trả về đúng định dạng JSON: { "data": [ { "date": "YYYY-MM-DD", "revenues": { "TenChiNhanh": SỐ_TIỀN_INT } } ] }`;
               
               const aiConfigStr = localStorage.getItem('taskflow_ai_config');
               const aiConfig = aiConfigStr ? JSON.parse(aiConfigStr) : null;
               
               if (!aiConfig || !aiConfig.apiKey) {
                  throw new Error("Hệ thống yêu cầu API Key. Vui lòng cấu hình tại Cài đặt Hệ thống.");
               }
               
               const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                     'Authorization': `Bearer ${aiConfig.apiKey}`,
                     'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                     model: aiConfig.aiModel,
                     messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: JSON.stringify(rawJsonData) }
                     ],
                     response_format: { type: 'json_object' }
                  })
               });
               
               if (!response.ok) {
                  throw new Error(`API AI phản hồi lỗi: ${response.status}`);
               }
               
               const responseJson = await response.json();
               if (responseJson.usage) {
                  fetch('http://localhost:3000/api/internal/log-tokens', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'x-user-role': user?.role || '',
                      'x-facility-id': user?.facility_id || ''
                    },
                    body: JSON.stringify({
                      username: user?.name || user?.username || 'unknown',
                      prompt_tokens: responseJson.usage.prompt_tokens || 0,
                      completion_tokens: responseJson.usage.completion_tokens || 0,
                      total_tokens: responseJson.usage.total_tokens || 0
                    })
                  }).catch(e => console.error("Lỗi log token:", e));
               }
               let content = responseJson.choices[0].message.content;
               
               let parsedAiData = [];
               try {
                  if (content.startsWith('```json')) content = content.replace(/```json/g, '').replace(/```/g, '').trim();
                  else if (content.startsWith('```')) content = content.replace(/```/g, '').trim();
                  
                  const obj = JSON.parse(content);
                  parsedAiData = obj.data || obj;
                  if (!Array.isArray(parsedAiData)) parsedAiData = [parsedAiData];
               } catch(e) {
                  throw new Error("AI trả về sai format JSON.");
               }
               
               setBatchData(parsedAiData);
            }
         } catch (err) {
            console.error("OpenRouter API Error:", err.message || err);
            setAiError('Lỗi kết nối AI. Vui lòng kiểm tra lại API Key hoặc thử lại sau.');
         } finally {
            setAiLoading(false);
            if(fileInputRef.current) fileInputRef.current.value = '';
         }
      };

      const handleBatchUpsert = (data) => {
         const allReports = JSON.parse(localStorage.getItem('taskflow_daily_financial_reports') || '[]');
         
         // Bước 1: Lấy mảng tất cả các report_date có trong payload gửi lên
         const datesToDelete = data.map(row => row.date);
         
         // Xóa sạch dữ liệu cũ của những ngày đó để dọn đường (DELETE WHERE IN)
         const newReports = allReports.filter(r => !datesToDelete.includes(r.date));
         
         // Bước 2: Chạy lệnh BULK INSERT toàn bộ mảng data mới
         data.forEach(row => {
            const dateStr = row.date;
            const revData = facilityList.map(f => {

                  id: f.id,
                  name: f.name,
                  revenue: row.revenues[f.name] || row.revenues[facNameShort] || 0,
                  note: 'AI Auto Extracted'
               };
            });
            const totalRev = revData.reduce((acc, curr) => acc + Number(curr.revenue), 0);
            
            newReports.push({
               id: 'rep_' + Date.now() + Math.random().toString(36).substr(2, 5),
               date: dateStr,
               createdBy: 'Finance Dept (AI)',
               timestamp: Date.now(),
               totalRevenue: totalRev,
               data: revData
            });

        setLoading(true);
        setTimeout(() => {
             const allReports = JSON.parse(localStorage.getItem('taskflow_daily_financial_reports') || '[]');
             
             const [yearStr, monthStr] = selectedMonth.split('-');
             const year = parseInt(yearStr, 10);
             const month = parseInt(monthStr, 10) - 1;
             
             const start = new Date(year, month, 1); start.setHours(0,0,0,0);
             const end = new Date(year, month + 1, 0); end.setHours(23,59,59,999);

             const timeFiltered = allReports.filter(r => {
                const rParts = r.date.split('-');
                const rDate = new Date(rParts[0], rParts[1]-1, rParts[2]);
                return rDate >= start && rDate <= end;
             });

             const isAllowedAll = ['SUPER_ADMIN', 'VICE_PRESIDENT', 'ADMIN', 'FINANCE_DEPT', 'DEPARTMENT_HEAD'].includes(user.role);
             const allowedFacs = Array.isArray(user.facility_id) ? user.facility_id : [user.facility_id];
             const hasAll = allowedFacs.includes('ALL');

             const aggregated = {};
             const defaultFacs = facilityList.length > 0 ? facilityList : Array.from({length: 6}, (_, i) => ({id: `f${i+1}`, name: `Cơ sở ${i+1}`}));
             
             defaultFacs.forEach(f => {
                if (isAllowedAll || hasAll || allowedFacs.includes(f.id) || allowedFacs.includes(f.name)) {
                   aggregated[f.name] = { id: f.id, name: f.name, revenue: 0, is_active: f.is_active !== false };
                }
             });

             timeFiltered.forEach(report => {
                if (report.data && Array.isArray(report.data)) {
                   report.data.forEach(facData => {
                      if (aggregated[facData.name]) {
                         const rev = Number(facData.revenue || 0);
                         aggregated[facData.name].revenue += rev;
                      }
                   });
                }
             });

             const finalData = Object.values(aggregated).filter(f => f.is_active || f.revenue > 0);

      return (

           {/* Header & Filter */}

             <div className="flex flex-col items-end gap-1">
                <div className="flex items-center gap-3">
                   {user.role === 'FINANCE_DEPT' && (

                          <span className="material-symbols-outlined text-[18px]">auto_awesome</span>

                   <label className="text-sm font-bold text-gray-700 dark:text-gray-300 ml-2">Tháng tra cứu:</label>
                   <input

                      onChange={e => setSelectedMonth(e.target.value)}
                      className="bg-gray-50 dark:bg-[#252525] border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2 outline-none focus:border-teal-500 text-sm font-medium dark:text-white cursor-pointer hover:border-teal-400 transition-colors"
                   />
                </div>
                {aiError && <div className="text-red-500 text-xs text-right mt-1 font-medium">{aiError}</div>}
             </div>
           </div>

           <HeatmapKPI user={user} facilityList={data} selectedMonth={selectedMonth} refreshToggle={refreshToggle} />

           {/* Cards */}
           <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 shrink-0 pb-6">
             {loading ? Array.from({length: 6}).map((_, i) => (
               <div key={i} className="bg-white dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-800 p-6 h-36 animate-pulse flex flex-col justify-between shadow-sm">

    function KPISettings({ user, facilityList, showToast, refreshFacilities }) {
       const [kpis, setKpis] = React.useState({});
       const [applyMonth, setApplyMonth] = React.useState('');
       const [showAddFacModal, setShowAddFacModal] = React.useState(false);
       const [newFacName, setNewFacName] = React.useState('');
       const [isAddingFac, setIsAddingFac] = React.useState(false);
       
       const defaultFacs = facilityList.length > 0 ? facilityList : Array.from({length: 6}, (_, i) => ({id: `f${i+1}`, name: `Cơ sở ${i+1}`}));

       React.useEffect(() => {
          const now = new Date();
          const currentMonth = `${now.getMonth() + 1}/${now.getFullYear()}`;
          setApplyMonth(currentMonth);

          const savedKpis = JSON.parse(localStorage.getItem('taskflow_facility_kpis') || '{}');
          
          const initialKpis = {};
          defaultFacs.forEach(f => {
             initialKpis[f.id] = savedKpis[f.id] || {
                facility_id: f.id,
                name: f.name,
                weekday_target: 5000000,
                weekend_target: 8000000,
             };
          });
          setKpis(initialKpis);
       }, [facilityList]);

       const handleSave = () => {
          const dataToSave = {};
          Object.values(kpis).forEach(k => {
             dataToSave[k.facility_id] = {
                ...k,
                apply_month: applyMonth,
                updated_at: Date.now(),
                updated_by: user.name
             };
          });
          localStorage.setItem('taskflow_facility_kpis', JSON.stringify(dataToSave));
          showToast('✅ Đã lưu cấu hình KPI thành công!');
       };

       const handleArchiveFacility = async (fac) => {
          const facId = fac.facility_id || fac.id;
          if (!window.confirm(`Bạn có chắc muốn lưu trữ cơ sở "${fac.name}"? Dữ liệu lịch sử vẫn sẽ được giữ nguyên.`)) return;

          setKpis(prev => {
             const next = { ...prev };
             delete next[facId];
             return next;
          });

          try {
             const res = await fetch(`http://localhost:5001/api/facilities/${facId}/archive`, { method: 'PUT' });
             const data = await res.json();
             if (data.success) {
                showToast('✅ Đã lưu trữ cơ sở thành công!');
                if (refreshFacilities) refreshFacilities();
             } else {
                showToast('❌ Lỗi: ' + data.error);
             }
          } catch(err) {
             const localFacs = JSON.parse(localStorage.getItem('taskflow_facilities') || '[]');
             const facIndex = localFacs.findIndex(f => f.id === facId);
             if (facIndex > -1) {
                localFacs[facIndex].is_active = false;
                localStorage.setItem('taskflow_facilities', JSON.stringify(localFacs));
                showToast('✅ Đã lưu trữ cơ sở thành công (Offline)!');
                if (refreshFacilities) refreshFacilities();
             }
          }
       };

       const handleAddFacility = async () => {
          if (!newFacName.trim()) {
             showToast('⚠️ Vui lòng nhập tên cơ sở!');
             return;
          }
          setIsAddingFac(true);
          try {
             const res = await fetch('http://localhost:5001/api/facilities', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newFacName })
             });
             const data = await res.json();
             if (data.success) {
                showToast('✅ Thêm cơ sở thành công!');
                setNewFacName('');
                setShowAddFacModal(false);
                if (refreshFacilities) refreshFacilities();
             } else {
                showToast('❌ Lỗi: ' + data.error);
             }
          } catch (err) {
             const localFacs = JSON.parse(localStorage.getItem('taskflow_facilities') || '[]');
             const newFac = { id: 'f' + Date.now(), name: newFacName.trim().toUpperCase() };
             localFacs.push(newFac);
             localStorage.setItem('taskflow_facilities', JSON.stringify(localFacs));
             showToast('✅ Thêm cơ sở thành công (Offline)!');
             setNewFacName('');
             setShowAddFacModal(false);
             if (refreshFacilities) refreshFacilities();
          }
          setIsAddingFac(false);
       };

       const handleInputChange = (id, field, value) => {
          const numValue = Number(value.replace(/\D/g, '')) || 0;
          setKpis(prev => ({
             ...prev,
             [id]: { ...prev[id], [field]: numValue }
          }));
       };

       const formatNum = (val) => new Intl.NumberFormat('vi-VN').format(val);

       return (
          <div className="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm overflow-y-auto custom-scrollbar h-[calc(100vh-120px)] animate-fade-in">
             <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-gray-100 dark:border-gray-800 pb-4">
                <div>
                   <h2 className="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                     <span className="material-symbols-outlined text-teal-600">track_changes</span> Cài đặt Chỉ tiêu KPI Doanh Thu
                   </h2>
                   <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">Cấu hình doanh thu kỳ vọng cho Ngày thường và Cuối tuần</p>
                </div>
                <div className="flex items-center gap-4">
                   <div className="flex items-center gap-2">
                      <span className="text-sm font-medium text-gray-700 dark:text-gray-300">Áp dụng từ:</span>
                      <select 
                         value={applyMonth} 
                         onChange={e => setApplyMonth(e.target.value)}
                         className="bg-gray-50 dark:bg-[#252525] border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-1.5 outline-none focus:border-teal-500 text-sm font-medium dark:text-white"
                      >
                         <option value={applyMonth}>{applyMonth}</option>
                      </select>
                   </div>
                   <button onClick={() => setShowAddFacModal(true)} className="bg-blue-100 text-blue-700 hover:bg-blue-200 dark:bg-blue-900/30 dark:text-blue-400 dark:hover:bg-blue-900/50 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                      <span className="material-symbols-outlined text-[18px]">add</span> Thêm Cơ Sở Mới
                   </button>
                   <button onClick={handleSave} className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                      <span className="material-symbols-outlined text-[18px]">save</span> Lưu Cấu Hình
                   </button>
                </div>
             </div>

             <div className="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
                <table className="w-full text-sm text-left">
                   <thead className="bg-gray-50 dark:bg-[#252525] text-gray-700 dark:text-gray-300">
                      <tr>
                         <th className="px-6 py-4 font-bold w-1/3">Tên Cơ Sở</th>
                         <th className="px-6 py-4 font-bold text-center">KPI Ngày thường (CN - T5)</th>
                         <th className="px-6 py-4 font-bold text-center">KPI Cuối tuần (T6 - T7)</th>
                         <th className="px-6 py-4 font-bold text-center w-20">Thao tác</th>
                      </tr>
                   </thead>
                   <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                      {Object.values(kpis).map(k => (
                         <tr key={k.facility_id} className="hover:bg-gray-50 dark:hover:bg-[#2a2a2a] transition-colors">
                            <td className="px-6 py-4 font-bold text-gray-900 dark:text-white flex items-center gap-3">
                               <span className="w-2 h-2 rounded-full bg-teal-500"></span>
                               {k.name}
                            </td>
                            <td className="px-6 py-4">
                               <div className="relative max-w-[200px] mx-auto">
                                  <input 
                                     type="text" 
                                     value={formatNum(k.weekday_target)}
                                     onChange={e => handleInputChange(k.facility_id, 'weekday_target', e.target.value)}
                                     className="w-full bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-right outline-none focus:border-teal-500 font-medium text-gray-900 dark:text-white"
                                     maxLength="15"
                                  />
                               </div>
                            </td>
                            <td className="px-6 py-4">
                               <div className="relative max-w-[200px] mx-auto">
                                  <input 
                                     type="text" 
                                     value={formatNum(k.weekend_target)}
                                     onChange={e => handleInputChange(k.facility_id, 'weekend_target', e.target.value)}
                                     className="w-full bg-white dark:bg-[#1a1a1a] border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-right outline-none focus:border-teal-500 font-medium text-gray-900 dark:text-white"
                                     maxLength="15"
                                  />
                               </div>
                            </td>
                            <td className="px-6 py-4 text-center">
                               <button onClick={() => handleArchiveFacility(k)} className="text-gray-400 hover:text-red-500 transition-colors p-1" title="Lưu trữ cơ sở">
                                  <span className="material-symbols-outlined text-[20px]">archive</span>
                               </button>
                            </td>
                         </tr>
                      ))}
                   </tbody>
                </table>
             </div>

             {showAddFacModal && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                   <div className="bg-white dark:bg-[#1e1e1e] rounded-xl shadow-2xl w-full max-w-sm p-6 animate-fade-in border border-gray-200 dark:border-gray-800">
                      <h3 className="text-lg font-bold text-gray-900 dark:text-white mb-4">Thêm Cơ Sở Mới</h3>
                      <input 
                         type="text" 
                         autoFocus
                         value={newFacName}
                         onChange={e => setNewFacName(e.target.value)}
                         placeholder="Nhập tên cơ sở (VD: DUBAI 88)"
                         className="w-full bg-gray-50 dark:bg-[#252525] border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 outline-none focus:border-teal-500 font-medium text-gray-900 dark:text-white mb-6 uppercase"
                      />
                      <div className="flex gap-3 justify-end">
                         <button onClick={() => setShowAddFacModal(false)} className="px-4 py-2 text-sm font-bold text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition">Hủy</button>
                         <button onClick={handleAddFacility} disabled={isAddingFac} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-bold transition flex items-center gap-2">
                            {isAddingFac ? 'Đang thêm...' : 'Lưu Cơ Sở'}
                         </button>
                      </div>
                   </div>
                </div>
             )}
          </div>
       );
    }

          if (t.deadline) {
            if (t.deadline < todayStr) {
               notifs.push({
                 id: `ping_overdue_${t.id}`,

                 taskId: t.id,

                 message: `[AI Alert] Task "${t.title}" đã trễ hạn! Bạn có cần hỗ trợ điều phối nhân sự không?`,
                 timestamp: new Date().toISOString(),
                 isRead: readNotifications.includes(`ping_overdue_${t.id}`)
               });
            } else if (t.deadline === todayStr) {
               notifs.push({
                 id: `ping_due_${t.id}`,

                 task: t,
                 message: `[AI Alert] Task "${t.title}" hết hạn trong hôm nay. Cố gắng lên nhé!`,

           notifs.push({

              timestamp: new Date().toISOString(),
              isRead: readNotifications.includes(`checkin_${todayStr}`)
           });

        return notifs.sort((a, b) => (a.isRead === b.isRead ? 0 : a.isRead ? 1 : -1));

      const unreadCount = notifications.filter(n => !n.isRead).length;

      const handleOpenNotifications = () => {

      const fetchDashboardStats = (filter) => {
        setIsStatsLoading(true);
        setTimeout(() => {
          const now = new Date('2026-05-15T19:42:42+07:00'); // System time as per metadata
          let start, end;
          if (filter === 'week') {
            const day = now.getDay() || 7;
            start = new Date(now);
            start.setHours(0, 0, 0, 0);
            start.setDate(now.getDate() - day + 1);
            end = new Date(start);
            end.setDate(start.getDate() + 6);
            end.setHours(23, 59, 59, 999);
          } else {
            start = new Date(now.getFullYear(), now.getMonth(), 1);
            start.setHours(0, 0, 0, 0);
            end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            end.setHours(23, 59, 59, 999);
          }

          // RLS Policy cho Dashboard Stats
          const accessibleTasks = tasks.filter(t => {
             if (['SUPER_ADMIN', 'VICE_PRESIDENT', 'ADMIN', 'GENERAL_MANAGER', 'DEPARTMENT_HEAD', 'FINANCE_DEPT'].includes(user.role)) {
                return true;
             }
             const facId = t.facilityId || t.facility;

          let userTasks = accessibleTasks;

          let open = 0, completed = 0, overdue = 0;

          userTasks.forEach(t => {
            const createdAt = new Date(t.createdAt || t.deadline);
            const deadline = new Date(t.deadline);
            const isDone = t.status === 'done' || t.status === 'review';
            const compAt = t.completedAt ? new Date(t.completedAt) : null;

            if (createdAt >= start && createdAt <= end && !isDone) {
              open++;
            }
            if (isDone && compAt && compAt >= start && compAt <= end) {
              completed++;
            }
            if (deadline >= start && deadline <= end) {
              if (!isDone) {
                if (now > deadline) overdue++;
              } else if (compAt && compAt > deadline) {
                overdue++;
              }
            }
          });

          setDashboardStats({ open, completed, overdue });
          setIsStatsLoading(false);

         if (['SUPER_ADMIN', 'VICE_PRESIDENT', 'ADMIN', 'GENERAL_MANAGER', 'DEPARTMENT_HEAD', 'FINANCE_DEPT'].includes(user.role)) {
            return true;

         // Mặc định cho FACILITY_MANAGER và các role khác
         const facId = t.facilityId || t.facility;
         const allowedFacs = Array.isArray(user.facility_id) ? user.facility_id : [user.facility_id || user.username];
         return allowedFacs.includes('ALL') || allowedFacs.includes(facId);
      });

      const isInternalTask = (t) => {
         const deptId = user.department_id || (user.username === 'marketing' ? 'MARKETING' : (user.role === 'FINANCE_DEPT' ? 'FINANCE' : ''));
         const tTitle = (t.title || '').toLowerCase();
         return t.department_tag === deptId || t.pic === user.name || t.picId === user.username || (deptId === 'MARKETING' && (tTitle.includes('marketing') || tTitle.includes('ads') || tTitle.includes('quảng cáo') || tTitle.includes('kịch bản') || tTitle.includes('video'))) || (deptId === 'FINANCE' && (tTitle.includes('doanh thu') || tTitle.includes('kế toán') || tTitle.includes('tài chính')));
      };

      const kanbanTasks = accessibleTasks.filter(t => t.status !== 'revoked' && (t.status !== 'done' || !t.completedAt || t.completedAt === todayStr) && (activeTab === 'internal-tasks' ? isInternalTask(t) : (globalFacilityFilter === 'ALL' || t.facilityId === globalFacilityFilter || t.facility === globalFacilityFilter)));
      const archivedTasks = accessibleTasks.filter(t => t.status === 'done' || t.status === 'revoked').filter(t => {
        if (archiveSearch && !t.title.toLowerCase().includes(archiveSearch.toLowerCase())) return false;
        if (archivePic && !t.pic.toLowerCase().includes(archivePic.toLowerCase())) return false;
        if (archiveDateFrom && t.completedAt && t.completedAt < archiveDateFrom) return false;
        if (archiveDateTo && t.completedAt && t.completedAt > archiveDateTo) return false;
        if (activeTab === 'internal-tasks') {
           if (!isInternalTask(t)) return false;
        } else {

        }
        return true;
      });

      const [facilityList, setFacilityList] = useState([]);

      const fetchFacilities = async () => {
         const addDynamicVPs = (facs) => {
            let updatedFacs = facs.filter(f => !f.isExecutive && f.id !== 'vp1' && f.id !== 'vp2');
            const users = JSON.parse(localStorage.getItem('taskflow_users') || '[]');
            const vpUsers = users.filter(u => u.role === 'VICE_PRESIDENT');
            vpUsers.forEach(vp => {
               updatedFacs.push({ id: `vp_${vp.id}`, name: `Sếp ${vp.name || vp.username}`, isExecutive: true, is_active: true });
            });
            return updatedFacs;
         };
         try {
            const res = await fetch('http://localhost:5001/api/facilities');
            const json = await res.json();
            if (json.success) {
               localStorage.setItem('taskflow_facilities', JSON.stringify(json.data));
               setFacilityList(addDynamicVPs(json.data));
            }
         } catch(err) {
            let localFacs = JSON.parse(localStorage.getItem('taskflow_facilities') || '[]');
            if (localFacs.some(f => f.isExecutive || f.id === 'vp1' || f.id === 'vp2')) {

               localStorage.setItem('taskflow_facilities', JSON.stringify(localFacs));
            }
            if (localFacs.length === 0) {
               localFacs = [
                  { id: 'f1', name: 'DUBAI 41', is_active: true },
                  { id: 'f2', name: 'DUBAI ACE', is_active: true },
                  { id: 'f3', name: 'DUBAI PA', is_active: true },
                  { id: 'f4', name: 'DUBAI PAK', is_active: true },
                  { id: 'f5', name: 'DUBAI PAV', is_active: true },
                  { id: 'f6', name: 'DUBAI PHÚ QUỐC', is_active: true }
               ];
               localStorage.setItem('taskflow_facilities', JSON.stringify(localFacs));
            }
            setFacilityList(addDynamicVPs(localFacs));
         }
      };

      useEffect(() => {
         fetchFacilities();
      }, []);

      const activeFacilities = facilityList.filter(f => f.is_active !== false).filter(f => {
         if (f.isExecutive) return user?.role === 'SUPER_ADMIN' || user?.role === 'VICE_PRESIDENT';
