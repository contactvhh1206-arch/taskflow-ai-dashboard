<!DOCTYPE html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow AI - Hệ Thống Quản Lý Công Việc</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- XLSX Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#004ccd",
              "on-primary": "#ffffff",
              "secondary": "#731be5",
              "background": "#fcf9f8",
              "surface": "#fcf9f8",
              "surface-variant": "#e5e2e1",
              "on-surface": "#1c1b1b",
              "on-surface-variant": "#424656",
              "outline": "#737687",
              "outline-variant": "#c3c6d8",
              "surface-container-low": "#f6f3f2",
              "surface-container": "#f0edec",
              "surface-container-high": "#eae7e7",
              "surface-container-highest": "#e5e2e1",
              "primary-container": "#0f62fe",
              "on-primary-container": "#f3f3ff",
              "error": "#ba1a1a",
              "error-container": "#ffdad6",
              "on-error-container": "#93000a",
              "success": "#137333",
              "success-container": "#e6f4ea"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Geist", "sans-serif"],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-background text-on-surface antialiased overflow-hidden h-screen w-screen flex">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
